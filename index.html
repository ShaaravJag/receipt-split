<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Receipt Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Figtree:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. A sticky top bar, the receipt as a tappable list, and the people at the table pinned to the bottom as name tabs. */
:root {
  --bg: #161413;
  --surface: #1F1C1A;
  --surface-2: #2A2624;
  --surface-3: #35302D;
  --line: #312C29;
  --line-strong: #4D4642;
  --fg: #F5F0EB;
  --muted: #A89F98;
  --faint: #6F6762;
  --accent: #F2552E;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(242, 85, 46, .16);
  --good: #5CC98B;
  --good-soft: rgba(92, 201, 139, .14);
  --warn: #F3B746;
  --warn-soft: rgba(243, 183, 70, .13);
  --bad: #FF6F61;
  --scrim: rgba(8, 6, 5, .64);
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --p-ink: #17130F;
  --p0: #7DBDFF; --p1: #FFB648; --p2: #7FD99A; --p3: #C9A2FF;
  --p4: #FF93B6; --p5: #57D3C6; --p6: #FF8F64; --p7: #DCCB72;
  --font-ui: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "Figtree", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --dock-h: 132px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F3F0; --surface: #FFFFFF; --surface-2: #EEEBE7; --surface-3: #E3DFDA;
    --line: #E4DFD9; --line-strong: #C6BEB7;
    --fg: #1C1815; --muted: #675E57; --faint: #A1978F;
    --accent: #DD4318; --accent-ink: #FFFFFF; --accent-soft: rgba(221, 67, 24, .10);
    --good: #1C8A4F; --good-soft: rgba(28, 138, 79, .10);
    --warn: #A2650A; --warn-soft: rgba(196, 128, 20, .13); --bad: #CC3324;
    --scrim: rgba(30, 24, 20, .40); --shadow: 0 18px 50px rgba(40, 30, 20, .18);
    --p-ink: #FFFFFF;
    --p0: #2166C4; --p1: #B0600A; --p2: #23824A; --p3: #7448CF;
    --p4: #C2386A; --p5: #0E857A; --p6: #C9481B; --p7: #7A6C10;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F3F0; --surface: #FFFFFF; --surface-2: #EEEBE7; --surface-3: #E3DFDA;
  --line: #E4DFD9; --line-strong: #C6BEB7;
  --fg: #1C1815; --muted: #675E57; --faint: #A1978F;
  --accent: #DD4318; --accent-ink: #FFFFFF; --accent-soft: rgba(221, 67, 24, .10);
  --good: #1C8A4F; --good-soft: rgba(28, 138, 79, .10);
  --warn: #A2650A; --warn-soft: rgba(196, 128, 20, .13); --bad: #CC3324;
  --scrim: rgba(30, 24, 20, .40); --shadow: 0 18px 50px rgba(40, 30, 20, .18);
  --p-ink: #FFFFFF;
  --p0: #2166C4; --p1: #B0600A; --p2: #23824A; --p3: #7448CF;
  --p4: #C2386A; --p5: #0E857A; --p6: #C9481B; --p7: #7A6C10;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
.app.with-dock { padding-bottom: calc(var(--dock-h) + 28px); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px;
  min-height: 56px; margin-inline: -16px; padding-inline: 6px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.tb-left { justify-self: start; min-width: 0; }
.tb-right { justify-self: end; min-width: 0; }
.tb-title { font-weight: 650; font-size: 1rem; max-width: min(36vw, 260px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; padding: 8px 4px; border-radius: 8px; }
button.tb-title:active { background: var(--surface-2); }
.navbtn { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; border-radius: 10px; font-size: 1.0625rem; color: var(--fg); white-space: nowrap; }
.navbtn svg.i { width: 22px; height: 22px; }
.navbtn.go { color: var(--accent); font-weight: 650; }
.navbtn[disabled] { color: var(--faint); cursor: default; }
.navbtn .count { font-size: .75rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-left: 4px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 18px; border-radius: 14px;
  font-weight: 650; font-size: 1rem; text-align: center;
  background: var(--surface-2); color: var(--fg);
  transition: transform .12s ease, background-color .15s ease, opacity .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { background: transparent; color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .9375rem; border-radius: 11px; }
.btn[disabled] { opacity: .42; cursor: default; transform: none; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 10px; color: var(--muted); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.text-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border-radius: 10px; color: var(--accent); font-weight: 650; font-size: .9375rem; }
.text-btn svg.i { width: 18px; height: 18px; }
.text-btn:active { background: var(--accent-soft); }
.seg { display: flex; padding: 3px; gap: 3px; background: var(--surface-2); border-radius: 12px; }
.seg button { flex: 1; min-height: 38px; padding: 0 10px; border-radius: 9px; font-weight: 650; font-size: .9375rem; color: var(--muted); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .22); }
.eyebrow { font-family: var(--font-mono); font-size: .75rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 650; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

/* ---------- home ---------- */
.home-head { padding-block: 36px 22px; display: grid; gap: 10px; }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 2.5rem; line-height: .95; letter-spacing: -.025em; font-variation-settings: "wdth" 80, "opsz" 96; }
.wordmark em { font-style: normal; color: var(--accent); }
.tagline { color: var(--muted); font-size: 1.0625rem; max-width: 34ch; }
.scan-cta {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  width: 100%; padding: 18px; border-radius: 20px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); overflow: hidden;
  transition: transform .12s ease;
}
.scan-cta:active { transform: scale(.985); }
.scan-cta .ic { width: 52px; height: 52px; border-radius: 15px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; }
.scan-cta .ic svg.i { width: 26px; height: 26px; }
.scan-cta .t1 { font-weight: 750; font-size: 1.1875rem; display: block; }
.scan-cta .t2 { opacity: .86; font-size: .875rem; display: block; }
.scan-cta.off { background: var(--surface-2); color: var(--fg); cursor: default; }
.scan-cta.off .ic { background: var(--surface-3); }
.home-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.file-host { position: relative; overflow: hidden; }
.file-hit { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; z-index: 3; font-size: 16px; }
.file-host:has(.file-hit:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.upload-cta { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; width: 100%; margin-top: 10px; padding: 14px 18px; border-radius: 18px; background: var(--surface); color: var(--fg); cursor: pointer; transition: transform .12s ease; }
.upload-cta:active { transform: scale(.985); }
.upload-cta .ic { width: 44px; height: 44px; border-radius: 13px; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); }
.upload-cta .t1 { font-weight: 700; font-size: 1.0625rem; display: block; }
.upload-cta .t2 { color: var(--muted); font-size: .875rem; display: block; }
.paste-help { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; font-size: .9rem; color: var(--muted); }
.paste-help ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.paste-help b { color: var(--fg); font-weight: 650; }
.paste-help .btn { justify-self: start; }
.steps { margin: 0 0 14px; padding-left: 22px; display: grid; gap: 10px; line-height: 1.45; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.scan-note { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: .875rem; }
.section { margin-top: 30px; display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-inline: 2px; }
.list { display: grid; gap: 1px; border-radius: 16px; overflow: hidden; background: var(--line); }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center; width: 100%; padding: 14px 16px; background: var(--surface); text-align: left; }
.list-row:active { background: var(--surface-2); }
.list-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--surface); }
.list-item .list-row { background: transparent; padding-right: 8px; }
.list-item .icon-btn { margin-right: 6px; }
.lr-title { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-sub { grid-column: 1; color: var(--muted); font-size: .875rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.lr-amt { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; display: grid; justify-items: end; gap: 3px; }
.empty { padding: 26px 20px; border: 1.5px dashed var(--line-strong); border-radius: 16px; color: var(--muted); text-align: center; display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--fg); font-weight: 650; }
.note { font-size: .875rem; color: var(--muted); }

/* ---------- items screen ---------- */
.progress-wrap { padding-block: 16px 4px; display: grid; gap: 8px; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: .9375rem; color: var(--muted); }
.progress-top b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
.bar.done > i { background: var(--good); }
.left-link { color: var(--accent); font-weight: 650; padding: 4px 0; }
.mode-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.mode-row .seg { flex: 1; }
.banner { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: start; margin-top: 12px; padding: 12px 6px 12px 14px; border-radius: 14px; background: var(--surface); color: var(--muted); font-size: .9rem; }
.banner .icon-btn { width: 32px; height: 32px; margin-top: -4px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .875rem; padding: 10px 12px; border-radius: 12px; line-height: 1.4; }
.check.ok { background: var(--good-soft); color: var(--good); }
.check.warn { background: var(--warn-soft); color: var(--warn); }
.check svg.i { width: 18px; height: 18px; margin-top: 1px; }
.check .text-btn { min-height: 0; padding: 0; font-size: .875rem; }
.receipt { margin-top: 22px; display: grid; gap: 6px; }
.receipt-head { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 2px; }
.rh-title { flex: 1; min-width: 0; text-align: left; border-radius: 10px; padding: 2px 0; }
.rh-name { font-family: var(--font-display); font-weight: 700; font-size: 1.3125rem; letter-spacing: -.012em; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variation-settings: "wdth" 88; }
.rh-meta { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); letter-spacing: .02em; }
.rows { display: grid; gap: 4px; }
.row {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 7px 12px;
  width: 100%; padding: 15px 14px; border-radius: 14px; background: var(--surface); text-align: left;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  transition: background-color .15s ease, transform .1s ease;
}
.row:active { transform: scale(.992); }
.row-name { font-size: 1.0625rem; font-weight: 500; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
.row-price { font-size: 1.0625rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row-price s { color: var(--faint); font-weight: 400; margin-right: 6px; }
.row-tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row-tags:empty { display: none; }
.row .tick { width: 20px; height: 20px; color: var(--pc); }
.row .qty { color: var(--muted); font-weight: 650; }
.row.mine { background: color-mix(in srgb, var(--pc) 17%, var(--surface)); }
.row.taken { background: color-mix(in srgb, var(--surface) 50%, var(--bg)); }
.row.taken .row-name, .row.taken .row-price { opacity: .42; }
.row.taken .row-tags { opacity: .8; }
.row.free .row-name, .row.free .row-price { color: var(--muted); }
.row.flash { animation: flash 1.1s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px transparent; } }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 3px; border-radius: 99px; background: var(--surface-2); font-size: .8125rem; font-weight: 650; color: var(--fg); max-width: 100%; }
.badge .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--pc); color: var(--p-ink); font-size: .6875rem; font-weight: 800; flex: none; }
.badge .bn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge.plain { padding: 0 9px; color: var(--muted); }
.badge.comp { padding: 0 9px; background: var(--good-soft); color: var(--good); }
.adj-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; padding: 11px 14px; border-radius: 14px; border: 1.5px dashed var(--line-strong); text-align: left; }
.adj-row .an { font-weight: 600; }
.adj-row .ad { grid-column: 1; font-size: .8125rem; color: var(--muted); }
.adj-row .aa { grid-row: 1 / span 2; grid-column: 2; font-weight: 650; font-variant-numeric: tabular-nums; }
.adj-row .aa.neg { color: var(--good); }
.add-line { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
.erow { display: grid; grid-template-columns: minmax(0, 1fr) 104px auto; gap: 6px; align-items: center; padding: 6px; border-radius: 14px; background: var(--surface); }
.erow .icon-btn { width: 36px; height: 44px; }
.inp { width: 100%; min-width: 0; height: 46px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; color: var(--fg); }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.money { text-align: right; font-variant-numeric: tabular-nums; }
.inp::placeholder { color: var(--faint); }
textarea.inp { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
.money-wrap { position: relative; }
.money-wrap .sym { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.money-wrap .inp { padding-left: 24px; }
.add-receipt { margin-top: 28px; display: grid; gap: 8px; }
.ar-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ar-row .btn { flex: 1 1 140px; }

/* ---------- people dock ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 93%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-inner { max-width: 560px; margin: 0 auto; padding-top: 9px; }
.dock-hint { padding: 0 16px 6px; font-size: .875rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 26px; }
.dock-hint .dh-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-hint b { color: var(--fg); font-weight: 650; }
.dock-hint .text-btn { min-height: 26px; padding: 0 6px; font-size: .8125rem; }
.chips { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 12px; scroll-padding-inline: 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.pwrap { flex: none; display: grid; gap: 5px; justify-items: stretch; }
.pwrap .uline { height: 3px; border-radius: 2px; background: transparent; }
.pwrap.on .uline { background: var(--pc); }
.pchip {
  --cut: 14px; position: relative; min-width: 86px; max-width: 150px; height: 60px; padding: 6px 14px 5px;
  display: grid; align-content: center; justify-items: center; gap: 1px; text-align: center; color: var(--fg);
  background: var(--line-strong);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% 100%, 0 100%, 0 var(--cut));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
.pchip::before { content: ""; position: absolute; inset: 1.5px; background: var(--bg); clip-path: polygon(calc(var(--cut) - .6px) 0, 100% 0, 100% 100%, 0 100%, 0 calc(var(--cut) - .6px)); }
.pchip > * { position: relative; }
.pchip .pc-name { font-size: 1rem; font-weight: 650; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.pchip .pc-name svg.i { width: 17px; height: 17px; }
.pchip .pc-amt { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pchip.on, .pchip.on::before { background: var(--pc); }
.pchip.on, .pchip.on .pc-amt { color: var(--p-ink); }
.pchip.on .pc-amt { opacity: .78; }
.pchip.grp::before { background: color-mix(in srgb, var(--pc) 32%, var(--bg)); }

  for (const p of people) { const w = item.shares && item.shares[p.id]; if (w > 0) out.push({ id: p.id, w }); }

/* Everything the screens show comes from here. All money is integer cents.
   Tax and tip are shared in proportion to what each person ordered. */
function compute(bill) {
  const people = bill.people, ids = people.map((p) => p.id);
  const zero = () => Object.fromEntries(ids.map((id) => [id, 0]));
  const per = {};
  for (const id of ids) per[id] = { food: 0, adj: 0, tax: 0, tip: 0, total: 0, parts: [] };
  const foodW = zero();
  const receipts = [];
  const tipParts = [];
  let food = 0, adj = 0, tax = 0, printedTip = 0, required = 0, assigned = 0, left = 0, firstLeft = null, taxMissing = false;

  for (const r of bill.receipts) {
    const rf = zero();
    let rItems = 0, rOrig = 0;
    for (const it of r.items) {
      const cost = itemCost(it);
      rItems += cost; rOrig += it.price;
      const sh = sharesOf(it, people);
      if (cost > 0) {
        required += cost;
        if (sh.length) assigned += cost;
        else { left++; if (!firstLeft) firstLeft = it.id; }
      }
      if (!sh.length) continue;
      const W = sum(sh.map((s) => s.w));
      const al = allocate(cost, sh.map((s) => s.w));
      sh.forEach((s, k) => {
        rf[s.id] += al[k];
        per[s.id].parts.push({ name: it.name || "Item", num: s.w * (it.qty || 1), den: W, cents: al[k] });
      });
    }
    const ra = zero();
    let rAdj = 0;
    for (const a of r.adjustments) {
      const amt = adjAmount(a, rItems);
      rAdj += amt;
      if (!ids.length || !amt) continue;
      if (a.split !== "proportional" && ids.includes(a.split)) ra[a.split] += amt;
      else allocate(amt, ids.map((id) => rf[id])).forEach((v, k) => (ra[ids[k]] += v));
    }
    const base = rItems + rAdj;
    const t = receiptTax(r, base);
    if (t == null) taxMissing = true;
    const rt = t || 0;
    if (ids.length) allocate(rt, ids.map((id) => Math.max(0, rf[id] + ra[id]))).forEach((v, k) => (per[ids[k]].tax += v));
    for (const id of ids) { per[id].food += rf[id]; per[id].adj += ra[id]; foodW[id] += rf[id]; }
    if (r.printedTip) { printedTip += r.printedTip; tipParts.push({ amount: r.printedTip, w: ids.map((id) => rf[id]) }); }
    food += rItems; adj += rAdj; tax += rt;

    let check = { status: "none" };
    if (r.subtotal != null) {
      const ok = [rOrig, rItems, rOrig + rAdj, rItems + rAdj].some((v) => Math.abs(v - r.subtotal) <= 1);
      check = ok ? { status: "ok", subtotal: r.subtotal } : { status: "warn", subtotal: r.subtotal, sum: rOrig, diff: r.subtotal - rOrig };
    }
    let totalCheck = null;
    if (r.total != null) {
      const expect = base + rt + (r.printedTip || 0);
      totalCheck = { ok: Math.abs(expect - r.total) <= 2, expect, total: r.total };
    }
    receipts.push({ id: r.id, items: rItems, orig: rOrig, adj: rAdj, base, tax: t, check, totalCheck });
  }

  const cfg = bill.tip || { mode: "percent", percent: 20 };
  const mode = cfg.mode === "printed" && !printedTip ? "percent" : cfg.mode;
  let tip = 0;
  if (mode === "printed") {
    tip = printedTip;
    if (ids.length) for (const tp of tipParts) allocate(tp.amount, tp.w).forEach((v, k) => (per[ids[k]].tip += v));
  } else {
    tip = mode === "percent" ? Math.round((food * (cfg.percent || 0)) / 100) : mode === "amount" ? Math.max(0, cfg.amount || 0) : 0;
    if (ids.length) allocate(tip, ids.map((id) => foodW[id])).forEach((v, k) => (per[ids[k]].tip += v));
  }
  for (const id of ids) { const p = per[id]; p.total = p.food + p.adj + p.tax + p.tip; }
  return {
    per, receipts, food, adj, tax, tip, tipMode: mode, printedTip,
    grand: food + adj + tax + tip, required, assigned, left, firstLeft, taxMissing,
    complete: ids.length > 0 && required > 0 && left === 0,
  };
}

/* Merge one person's portions by item name: two halves of calamari read "Calamari". */
function personLines(parts) {
  const map = new Map();
  for (const p of parts) {
    const key = norm(p.name);
    const e = map.get(key);
    if (e) {
      const n = e.num * p.den + p.num * e.den, d = e.den * p.den, g = gcd(n, d);
      e.num = n / g; e.den = d / g; e.cents += p.cents;
    } else map.set(key, { name: String(p.name).trim(), num: p.num, den: p.den, cents: p.cents });
  }
  return [...map.values()].map((e) => portionLabel(e.num, e.den, e.name));
}
function tipLabel(bill, calc) {
  if (calc.tipMode === "percent") return `Tip (${trimNum(bill.tip.percent || 0)}%)`;
  if (calc.tipMode === "printed") return "Tip (on receipt)";
  if (calc.tipMode === "none") return "Tip";
  return "Tip (fixed)";
}
function summaryText(bill, calc) {
  const out = [billTitle(bill), `${fmtDate(billDate(bill), true)} · ${plural(bill.people.length, "person", "people")}`, ""];
  for (const p of bill.people) {
    const c = calc.per[p.id];
    out.push(`${p.name}: ${money(c.total)}${bill.paid && bill.paid[p.id] ? " (paid)" : ""}`);
    const items = personLines(c.parts).join(", ");
    if (items) out.push(`   ${items}`);
  }
  out.push("", `Subtotal ${money(calc.food)}`);
  if (calc.adj) out.push(`Fees & discounts ${money(calc.adj, { sign: true })}`);
  out.push(`Tax ${money(calc.tax)}`, `${tipLabel(bill, calc)} ${money(calc.tip)}`, `Total ${money(calc.grand)}`);
  return out.join("\n");
}

/* ================= reading Claude's answer ================= */
function normalizeScan(raw) {
  const o = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  const num = (v) => {
    if (typeof v === "number" && isFinite(v)) return v;
    if (typeof v === "string") { const n = parseFloat(v.replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : null; }
    return null;
  };
  const cents = (v) => { const n = num(v); return n == null ? null : Math.round(n * 100); };
  const str = (v, max = 80) => (typeof v === "string" && v.trim() ? v.trim().replace(/\s+/g, " ").slice(0, max) : "");
  const arr = (v) => (Array.isArray(v) ? v : []);
  const items = [], adjustments = [];
  for (const it of arr(o.items)) {
    const name = str(it && it.name, 70);
    const price = cents(it && it.price);
    if (!name || price == null) continue;
    let qty = Math.round(num(it.qty) ?? 1);
    if (!(qty >= 1) || qty > 99) qty = 1;
    if (price < 0) { adjustments.push({ name, amount: price }); continue; }
    items.push({ name, qty, price });
  }
  for (const f of arr(o.fees)) {
    const amount = cents(f && f.amount);
    if (amount) adjustments.push({ name: str(f.name, 50) || (amount < 0 ? "Discount" : "Fee"), amount });
  }
  const rate = num(o.taxRate);
  return {
    merchant: str(o.merchant, 50), location: str(o.location, 40), date: validDate(o.date),
    currency: typeof o.currency === "string" && /^[A-Z]{3}$/.test(o.currency) ? o.currency : null,
    items, adjustments,
    subtotal: cents(o.subtotal), tax: cents(o.tax), taxRate: rate != null && rate > 0 && rate < 30 ? rate : null,
    tip: cents(o.tip), total: cents(o.total), notes: str(o.notes, 240),
  };
}
/* Lines like "5 Moran's Special $60" become five $12 items you can hand out one by one. */
function itemsFromScan(list) {
  const out = [];
  for (const it of list) {
    if (it.qty > 1 && it.qty <= 12) {
      const g = "g" + uid();
      allocate(it.price, Array(it.qty).fill(1)).forEach((p) => out.push(newItem({ name: it.name, price: p, groupId: g })));
    } else out.push(newItem({ name: it.name, price: it.price, qty: it.qty }));
  }
  return out;
}
function receiptFromScan(s) {
  const r = newReceipt({
    merchant: s.merchant, location: s.location, date: s.date,
    subtotal: s.subtotal, total: s.total, printedTip: s.tip || null,
    notes: s.notes, scanned: true,
  });
  r.items = itemsFromScan(s.items);
  r.adjustments = s.adjustments.map((a) => newAdj({ name: a.name, kind: a.amount < 0 ? "discount" : "fee", value: Math.abs(a.amount) }));
  if (s.tax != null) { r.taxMode = "amount"; r.tax = s.tax; }
  else if (s.taxRate != null) { r.taxMode = "rate"; r.taxRate = s.taxRate; }
  return r;
}

const capCache = {};
function cap(name) {
  if (capCache[name]) return capCache[name];
  const c = window.claude;
  if (!c || typeof c.use !== "function") return Promise.resolve(null);
  return (capCache[name] = c.use(name).catch(() => null));
}

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
  keys(prefix) {
    try { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) out.push(k); } return out; }
    catch { return []; }
  },
};

/* Bills live in this viewer's private corner of the artifact's database
   (data/users/<id>/app/bills/<billId>), with a local copy so the page opens instantly. */
const Store = {
  bills: new Map(), synced: new Map(), listeners: new Set(),
  settings: { lastTaxRate: null, meName: "" },
  col: null, settingsRef: null, remote: "connecting",
  timers: new Map(), inflight: new Set(), again: new Set(), retried: new Set(), tomb: new Set(),

  init() {
    for (const k of LS.keys("rs1.b.")) {
      const e = LS.get(k);
      if (e && e.bill && e.bill.id) { this.bills.set(e.bill.id, e.bill); this.synced.set(e.bill.id, !!e.synced); }
    }
    Object.assign(this.settings, LS.get("rs1.settings", {}));
    for (const id of LS.get("rs1.tomb", [])) this.tomb.add(id);
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { for (const fn of this.listeners) fn(); },
  list() { return [...this.bills.values()].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
  writeLocal(bill, synced) { LS.set("rs1.b." + bill.id, { bill, synced }); this.synced.set(bill.id, synced); },
  save(bill) {
    if (this.tomb.delete(bill.id)) LS.set("rs1.tomb", [...this.tomb]);
    this.bills.set(bill.id, bill); this.writeLocal(bill, false); this.queue(bill.id); this.emit();
  },
  queue(id, delay = 700) {
    if (!this.col) return;
    clearTimeout(this.timers.get(id));
    this.timers.set(id, setTimeout(() => { this.timers.delete(id); this.flush(id); }, delay));
  },
  flushAll() { for (const [id, t] of [...this.timers]) { clearTimeout(t); this.timers.delete(id); this.flush(id); } },
  async flush(id) {
    if (!this.col) return;
    if (this.inflight.has(id)) { this.again.add(id); return; }
    const bill = this.bills.get(id);
    if (!bill) return;
    this.inflight.add(id);
    try {
      await this.col.doc(id).set(clone(bill));
      this.retried.delete(id);
      if (this.bills.get(id) === bill) this.writeLocal(bill, true);
    } catch (e) {
      const code = e && e.code;
      if ((code === "unavailable" || !code) && !this.retried.has(id)) { this.retried.add(id); setTimeout(() => this.queue(id, 0), 1200 + Math.random() * 1500); }
      else console.warn("Could not save bill", code, e && e.message);
    } finally {
      this.inflight.delete(id);
      if (this.again.delete(id)) this.flush(id);
    }
  },
  remove(id) {
    clearTimeout(this.timers.get(id)); this.timers.delete(id);
    this.bills.delete(id); this.synced.delete(id); LS.del("rs1.b." + id);
    const tomb = () => { this.tomb.add(id); LS.set("rs1.tomb", [...this.tomb]); };
    if (this.col) this.col.doc(id).delete().catch(tomb); else tomb();
    this.emit();
  },
  setSetting(patch) {
    Object.assign(this.settings, patch);
    LS.set("rs1.settings", this.settings);
    if (this.settingsRef) {
      clearTimeout(this._st);
      this._st = setTimeout(() => this.settingsRef.set({ kind: "settings", ...this.settings }).catch(() => {}), 900);
    }
  },
  async connect() {
    const [db, user] = await Promise.all([cap("db"), cap("user")]);
    const id = user ? await user.id().catch(() => null) : null;
    if (!db || !id) { this.remote = "off"; this.emit(); return; }
    let base, col;
    try { base = db.doc(`data/users/${id}/app`); col = base.collection("bills"); }
    catch { this.remote = "off"; this.emit(); return; }
    this.settingsRef = base; this.col = col; this.remote = "on";
    base.get().then((s) => {
      if (!s.exists) return;
      const d = s.data() || {};
      if ("lastTaxRate" in d) this.settings.lastTaxRate = d.lastTaxRate;
      if ("meName" in d) this.settings.meName = d.meName;
      LS.set("rs1.settings", this.settings); this.emit();
    }).catch(() => {});
    for (const tid of [...this.tomb]) col.doc(tid).delete().then(() => { this.tomb.delete(tid); LS.set("rs1.tomb", [...this.tomb]); }).catch(() => {});
    const LIMIT = 300;
    col.orderBy("updatedAt", "desc").limit(LIMIT).onSnapshot((snap) => {
      const seen = new Set();
      for (const d of snap.docs) {
        seen.add(d.id);
        if (this.tomb.has(d.id)) continue;
        const b = d.data();
        if (!b || b.kind !== "bill") continue;
        const local = this.bills.get(d.id);
        const ru = b.updatedAt || 0, lu = local ? local.updatedAt || 0 : -1;
        if (ru > lu) { const c = clone(b); this.bills.set(d.id, c); this.writeLocal(c, true); }
        else if (ru === lu) { if (!this.synced.get(d.id)) this.writeLocal(local, true); }
        else this.queue(d.id, 50);
      }
      if (!snap.metadata || !snap.metadata.fromCache) {
        for (const [bid, ok] of [...this.synced]) {
          if (seen.has(bid)) continue;
          if (ok && snap.size < LIMIT) { this.bills.delete(bid); this.synced.delete(bid); LS.del("rs1.b." + bid); }
          else if (!ok) this.queue(bid, 50);
        }
      }
      this.emit();
    }, (err) => { console.warn("History sync stopped", err && err.code); });
  },
};
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") Store.flushAll(); });
addEventListener("pagehide", () => Store.flushAll());

/* ================= photos ================= */
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}
/* The photo, rotated, at most 4096px on a side (keeps phone canvases inside memory limits). */
function makeSource(img, rot) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  const s = Math.min(1, 4096 / Math.max(w0, h0));
  const w = Math.round(w0 * s), h = Math.round(h0 * s);
  const swap = rot % 180 !== 0;
  const c = document.createElement("canvas");
  c.width = swap ? h : w; c.height = swap ? w : h;
  const g = c.getContext("2d");
  g.translate(c.width / 2, c.height / 2);
  g.rotate((rot * Math.PI) / 180);
  g.drawImage(img, -w / 2, -h / 2, w, h);
  return c;
}
function canvasBlob(c, type = "image/jpeg", q = 0.9) {
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), type, q));
}
function cropTo(source, sx, sy, sw, sh, maxPx) {
  const s = Math.min(1, Math.sqrt(maxPx / (sw * sh)));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(sw * s)); c.height = Math.max(1, Math.round(sh * s));
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(source, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
/* Claude sees each image at about 1.2 megapixels, which blurs the small print on a long
   receipt. So tall crops also go out as 2–3 zoomed slices next to the whole picture. */
async function buildScanImages(source, crop, maxCount) {
  const W = source.width, H = source.height;
  const sx = crop.x * W, sy = crop.y * H, sw = Math.max(8, crop.w * W), sh = Math.max(8, crop.h * H);
  const ratio = sh / sw, n = Math.max(1, maxCount || 1);
  let tiles = 0, overview = true;
  if (ratio > 1.7 && n >= 3) tiles = Math.min(n - 1, ratio > 3.2 ? 3 : 2);
  else if (ratio > 1.7 && n === 2) { tiles = 2; overview = false; }
  const canvases = [];
  if (overview) canvases.push(cropTo(source, sx, sy, sw, sh, 1.25e6));
  if (tiles) {
    const step = sh / tiles, ov = step * 0.1;
    for (let i = 0; i < tiles; i++) {
      const y0 = Math.max(sy, sy + i * step - ov), y1 = Math.min(sy + sh, sy + (i + 1) * step + ov);
      canvases.push(cropTo(source, sx, y0, sw, y1 - y0, 1.25e6));
    }
  }
  const blobs = [];
  for (const c of canvases) blobs.push(await canvasBlob(c));
  const thumb = URL.createObjectURL(await canvasBlob(cropTo(source, sx, sy, sw, sh, 4e5), "image/jpeg", 0.8));
  return { blobs, layout: { overview, tiles }, thumb };
}

/* ================= asking Claude ================= */
const SCAN_SHAPE = `{"merchant": string|null, "location": string|null, "date": "YYYY-MM-DD"|null, "currency": "USD", "items": [{"name": string, "qty": number, "price": number}], "fees": [{"name": string, "amount": number}], "subtotal": number|null, "tax": number|null, "taxRate": number|null, "tip": number|null, "total": number|null, "notes": string|null}`;

  `- Add-ons printed under an item with their own price: add that price to the item above and put the add-on in parentheses, e.g. "Burger (add bacon)". Ignore $0.00 modifiers.`,

  `- fees: service charges and delivery or kitchen fees as positive amounts; discounts, coupons, promos and comps as negative amounts. Tax, tip, subtotal and total never go in items or fees.`,

  `- tip: only a tip or gratuity actually charged on this receipt (e.g. "Gratuity 18%: 48.60"). A suggested-tip table is not a tip: use null.`,
  `- merchant: the short restaurant name; location: the city or neighborhood if printed.`,
  `- Numbers are plain decimals with no currency symbols. Use null for anything not printed.`,

  const sample = await cap("sample");

  const opts = {
    images: blobs, signal, modelTier: careful ? "complex" : "default",
    onText: ({ text }) => onFound && onFound((text.match(/"qty"/g) || []).length),
  };
  if (careful) opts.cache = false;
  const raw = await sample.json(scanPrompt(layout, note), opts);
  return normalizeScan(raw);
}
async function runTextScan({ text, note, careful, signal, onFound }) {
  const sample = await cap("sample");
  if (!sample) throw { code: "capability_disabled" };
  const opts = { signal, modelTier: careful ? "complex" : "default", onText: ({ text: t }) => onFound && onFound((t.match(/"qty"/g) || []).length) };
  if (careful) opts.cache = false;
  return normalizeScan(await sample.json(textPrompt(text, note), opts));

/* A reading from a Claude chat is already JSON: one receipt, or {"receipts": [...]} for several. */
function scansFromObject(o) {
  if (!o || typeof o !== "object") return null;
  const list = Array.isArray(o.receipts) && o.receipts.length ? o.receipts : Array.isArray(o.items) ? [o] : [];
  const scans = list.map(normalizeScan).filter((x) => x.items.length);
  return scans.length ? scans : null;
}
function parsePastedJson(text) {
  const t = String(text || "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try { return scansFromObject(JSON.parse(t.slice(a, b + 1))); } catch { return null; }
}
/* The Receipt Split skill in a Claude chat hands its reading over in the link: #r1.<base64url JSON> */
function readHandoff() {
  const h = (location.hash || "").replace(/^#/, "");
  if (!h.startsWith("r1.")) return null;
  try {
    let b64 = h.slice(3).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
    const obj = JSON.parse(new TextDecoder().decode(bytes));
    const scans = scansFromObject(obj);
    return scans ? { key: String(obj.id || h.slice(3, 43)), scans } : null;
  } catch { return null; }
}

function scanErrorCopy(e) {
  const code = (e && e.code) || "upstream_error";
  const map = {
    not_granted: ["Claude wasn't allowed for this page", "Scanning needs your OK to use Claude. You can still type the items in."],
    sampling_disabled: ["Claude isn't available on this account", "You can still type the items in by hand."],
    rate_limited: ["You've hit your Claude limit for now", "Try again in a little while, or type the items in by hand."],
    session_expired: ["You're signed out of Claude", "Sign in again, then try the scan again."],
    image_rejected: ["That photo couldn't be read", "Try a JPEG or PNG, or take a new photo of the receipt."],
    refused: ["Claude couldn't read this photo", "Try a clearer photo with just the receipt in the frame."],
    invalid_json: ["The answer didn't come back as a list of items", "Try again. A tighter crop around the receipt helps."],
    empty_completion: ["Claude didn't send anything back", "Try again with a tighter crop around the receipt."],
    prompt_too_large: ["That was too much to read at once", "Crop to just the receipt and try again."],
    images_unavailable: ["Claude can't read photos inside this page here", "Send the photo to Claude in a chat instead. It sends back a link that opens here with the items filled in."],
    capability_disabled: ["Claude can't be reached from this view", "Paste the receipt text instead, or type the items in."],
  };
  const [title, body] = map[code] || ["Couldn't reach Claude", "Check your connection and try again."];
  return { code, title, body, detail: e && e.detail, retry: !["not_granted", "sampling_disabled", "images_unavailable", "capability_disabled"].includes(code) };
}

async function renderSummaryPNG(bill, calc) {
  const css = getComputedStyle(document.documentElement);
  const v = (n) => css.getPropertyValue(n).trim();
  const C = { bg: v("--bg"), card: v("--surface"), fg: v("--fg"), muted: v("--muted"), line: v("--line"), good: v("--good"), goodSoft: v("--good-soft") };
  const F = { ui: v("--font-ui"), d: v("--font-display"), m: v("--font-mono") };
  try {
    await Promise.all([
      document.fonts.load(`750 58px ${F.d}`), document.fonts.load(`400 30px ${F.ui}`),
      document.fonts.load(`700 36px ${F.ui}`), document.fonts.load(`800 40px ${F.ui}`), document.fonts.load(`400 26px ${F.m}`),
    ]);
  } catch {}
  const W = 1080, M = 40, P = 56, inner = W - 2 * M - 2 * P;
  const wrap = (g, text, maxW) => {
    const words = String(text).split(/\s+/).filter(Boolean), lines = [];
    let cur = "";
    for (const w of words) { const t = cur ? cur + " " + w : w; if (!cur || g.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; } }
    if (cur) lines.push(cur);
    return lines;
  };
  const paint = (g, draw) => {
    let y = M + P;
    const text = (s, x, yy, font, color, align = "left") => { if (!draw) return; g.font = font; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, yy); };
    const rule = (yy) => { if (draw) { g.fillStyle = C.line; g.fillRect(M + P, yy, inner, 2); } };
    g.font = `750 58px ${F.d}`;
    for (const l of wrap(g, billTitle(bill), inner)) { y += 58; text(l, M + P, y, `750 58px ${F.d}`, C.fg); y += 8; }
    y += 34;
    text(`${fmtDate(billDate(bill), true)} · ${plural(bill.people.length, "person", "people")}`.toUpperCase(), M + P, y, `400 26px ${F.m}`, C.muted);
    y += 34;
    for (const p of bill.people) {
      const c = calc.per[p.id];
      rule(y); y += 30;
      const amt = money(c.total);
      g.font = `800 40px ${F.ui}`; const aw = g.measureText(amt).width;
      g.font = `700 36px ${F.ui}`;
      const nm = wrap(g, p.name + (p.me ? " (you)" : ""), inner - aw - 160)[0] || p.name;
      y += 38;
      text(nm, M + P, y, `700 36px ${F.ui}`, C.fg);
      text(amt, M + P + inner, y, `800 40px ${F.ui}`, C.fg, "right");
      if (bill.paid && bill.paid[p.id] && !p.me) {
        g.font = `700 36px ${F.ui}`; const nx = M + P + g.measureText(nm).width + 18;
        if (draw) { g.fillStyle = C.goodSoft; roundRect(g, nx, y - 31, 96, 38, 19); g.fill(); }
        text("PAID", nx + 48, y - 3, `600 22px ${F.m}`, C.good, "center");
      }
      g.font = `400 30px ${F.ui}`;
      const lines = wrap(g, personLines(c.parts).join(", "), inner);
      for (const l of lines) { y += 42; text(l, M + P, y, `400 30px ${F.ui}`, C.muted); }
      y += 30;
    }
    rule(y); y += 22;
    const foot = [["Subtotal", money(calc.food)]];
    if (calc.adj) foot.push(["Fees & discounts", money(calc.adj, { sign: true })]);
    foot.push(["Tax", money(calc.tax)], [tipLabel(bill, calc), money(calc.tip)]);
    for (const [a, b] of foot) { y += 42; text(a, M + P, y, `400 30px ${F.ui}`, C.muted); text(b, M + P + inner, y, `400 30px ${F.ui}`, C.muted, "right"); }
    y += 26; rule(y); y += 56;
    text("Total", M + P, y, `800 42px ${F.ui}`, C.fg); text(money(calc.grand), M + P + inner, y, `800 42px ${F.ui}`, C.fg, "right");
    return y + P;
  };
  const probe = document.createElement("canvas").getContext("2d");
  const cardBottom = paint(probe, false);
  const H = cardBottom + 18 + M;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = C.card;
  g.beginPath();
  const r = 36, x0 = M, x1 = W - M, y0 = M, y1 = cardBottom;
  g.moveTo(x0 + r, y0); g.lineTo(x1 - r, y0); g.quadraticCurveTo(x1, y0, x1, y0 + r); g.lineTo(x1, y1);
  const tooth = 18, n = Math.round((x1 - x0) / tooth), tw = (x1 - x0) / n;
  for (let i = n - 1; i >= 0; i--) { g.lineTo(x0 + i * tw + tw / 2, y1 + 14); g.lineTo(x0 + i * tw, y1); }
  g.lineTo(x0, y0 + r); g.quadraticCurveTo(x0, y0, x0 + r, y0); g.closePath(); g.fill();
  paint(g, true);
  return canvasBlob(cv, "image/png");
}
function roundRect(g, x, y, w, hh, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + hh - r);
  g.quadraticCurveTo(x + w, y + hh, x + w - r, y + hh); g.lineTo(x + r, y + hh); g.quadraticCurveTo(x, y + hh, x, y + hh - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
async function copyText(text) {

}

/* tap vs. long-press on the same element */
function usePress(onTap, onLong, ms = 460) {
  const st = useRef({});
  const clear = () => { clearTimeout(st.current.t); st.current.t = null; };
  return {
    onPointerDown: (e) => {
      if (e.button > 0) return;
      clear();
      st.current = { x: e.clientX, y: e.clientY, fired: false };
      st.current.t = setTimeout(() => { st.current.fired = true; st.current.t = null; if (navigator.vibrate) try { navigator.vibrate(12); } catch {} onLong && onLong(); }, ms);
    },
    onPointerMove: (e) => { const s = st.current; if (s.t && (Math.abs(e.clientX - s.x) > 9 || Math.abs(e.clientY - s.y) > 9)) clear(); },
    onPointerUp: clear,
    onPointerCancel: clear,
    onPointerLeave: clear,
    onContextMenu: (e) => { e.preventDefault(); if (!st.current.fired) { clear(); st.current.fired = true; onLong && onLong(); } },
    onClick: (e) => { if (st.current.fired) { st.current.fired = false; e.preventDefault(); return; } onTap && onTap(e); },
  };
}

}

function Stepper({ value, min = 1, max = 99, onChange, label }) {

function owedByName(bills) {
  const map = new Map();
  for (const b of bills) {
    if (b.status !== "done") continue;
    const calc = compute(b);
    if (!calc.complete) continue;
    for (const p of b.people) {
      if (p.me || (b.paid && b.paid[p.id])) continue;
      const amt = calc.per[p.id].total;
      if (amt <= 0) continue;
      const key = norm(p.name);
      const e = map.get(key) || { key, name: p.name, total: 0, entries: [] };
      e.total += amt;
      e.entries.push({ billId: b.id, personId: p.id, amount: amt, title: billTitle(b), date: billDate(b) });
      map.set(key, e);
    }
  }
  return [...map.values()].sort((a, b) => b.total - a.total);
}
function billStatus(b) {
  const calc = compute(b);
  if (b.status !== "done") {
    if (!b.receipts.length) return { calc, pill: html`<span class="pill accent">Draft</span>` };
    if (!b.people.length) return { calc, pill: html`<span class="pill accent">Add people</span>` };
    if (calc.left) return { calc, pill: html`<span class="pill accent">${plural(calc.left, "item")} left</span>` };
    return { calc, pill: html`<span class="pill accent">Tax & tip next</span>` };
  }
  const unpaid = b.people.filter((p) => !p.me && !(b.paid && b.paid[p.id]));
  return { calc, pill: unpaid.length ? html`<span class="pill warn">${unpaid.length} unpaid</span>` : html`<span class="pill good">Settled</span>` };
}

      <div class="section-head"><h2 class="eyebrow">Still owed</h2><span class="note num">${money(sum(owed.map((o) => o.total)), { currency: "USD" })}</span></div>
      <div class="list">${owed.map((o) => html`<button class="list-row" key=${o.key} onClick=${() => onOwed(o.key)}>
        <span class="lr-title">${o.name}</span>
        <span class="lr-amt"><span>${money(o.total, { currency: "USD" })}</span></span>
        <span class="lr-sub">${plural(o.entries.length, "bill")} · tap to mark paid</span>
      </button>`)}</div>
    </section>`}

    <section class="section">
      <div class="section-head"><h2 class="eyebrow">History</h2>${done.length > 0 && html`<span class="note">${plural(done.length, "bill")}</span>`}</div>
      ${done.length
        ? html`<div class="list">${done.map((b) => row(b, false))}</div>`
        : html`<div class="empty"><b>No finished bills yet</b><span>When you finish a split it lands here, with who has paid you back.</span></div>`}
    </section>
  </main>`;
}

/* ================= scanning ================= */
function Cropper({ src, crop, setCrop }) {
  const stage = useRef();
  const [box, setBox] = useState({ w: 0, h: 0 });
  useLayoutEffect(() => {
    const el = stage.current;
    const fit = () => {
      const r = el.getBoundingClientRect();
      const aw = Math.max(40, r.width - 48), ah = Math.max(40, r.height - 44);
      const s = Math.min(aw / src.w, ah / src.h);
      setBox({ w: Math.floor(src.w * s), h: Math.floor(src.h * s) });
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(el);
    return () => ro.disconnect();
  }, [src]);
  const drag = useRef(null);
  const down = (e, kind) => {
    e.preventDefault(); e.stopPropagation();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    drag.current = { kind, x: e.clientX, y: e.clientY, c: { ...crop } };
  };
  const move = (e) => {
    const d = drag.current;
    if (!d || !box.w) return;
    const dx = (e.clientX - d.x) / box.w, dy = (e.clientY - d.y) / box.h, MIN = 0.08;
    let { x, y, w, h } = d.c;
    if (d.kind === "move") { x = clamp(x + dx, 0, 1 - w); y = clamp(y + dy, 0, 1 - h); }
    else {
      let x1 = x, y1 = y, x2 = x + w, y2 = y + h;
      if (d.kind.includes("w")) x1 = clamp(x1 + dx, 0, x2 - MIN);
      if (d.kind.includes("e")) x2 = clamp(x2 + dx, x1 + MIN, 1);
      if (d.kind.includes("n")) y1 = clamp(y1 + dy, 0, y2 - MIN);
      if (d.kind.includes("s")) y2 = clamp(y2 + dy, y1 + MIN, 1);
      x = x1; y = y1; w = x2 - x1; h = y2 - y1;
    }
    setCrop({ x, y, w, h });
  };
  const up = () => { drag.current = null; };
  const L = crop.x * box.w, T = crop.y * box.h, Wd = crop.w * box.w, Hd = crop.h * box.h;
  return html`<div class="stage" ref=${stage}>
    ${box.w > 0 && html`<div class="crop-frame" style=${{ width: box.w + "px", height: box.h + "px" }} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
      <img src=${src.url} alt="Your receipt photo" draggable="false" />
      <div class="dim" style=${{ left: 0, top: 0, width: "100%", height: T + "px" }}></div>
      <div class="dim" style=${{ left: 0, top: T + Hd + "px", width: "100%", height: Math.max(0, box.h - T - Hd) + "px" }}></div>
      <div class="dim" style=${{ left: 0, top: T + "px", width: L + "px", height: Hd + "px" }}></div>
      <div class="dim" style=${{ left: L + Wd + "px", top: T + "px", width: Math.max(0, box.w - L - Wd) + "px", height: Hd + "px" }}></div>
      <div class="crop-box" style=${{ left: L + "px", top: T + "px", width: Wd + "px", height: Hd + "px" }} onPointerDown=${(e) => down(e, "move")}>
        <div class="grid"></div>
        ${["nw", "ne", "sw", "se"].map((k) => html`<div key=${k} class=${"h " + k} onPointerDown=${(e) => down(e, k)}></div>`)}
      </div>
    </div>`}
  </div>`;
}

function ScanScreen({ job, onCancel, onResult, onManual, onPaste, onHowTo }) {
  const [phase, setPhase] = useState("loading");
  const [src, setSrc] = useState(null);
  const [rot, setRot] = useState(0);
  const [crop, setCrop] = useState({ x: 0, y: 0, w: 1, h: 1 });
  const [found, setFound] = useState(0);
  const [secs, setSecs] = useState(0);
  const [err, setErr] = useState(null);
  const [note, setNote] = useState("");
  const [thumb, setThumb] = useState(null);
  const img = useRef(null), ctl = useRef(null), urls = useRef([]);
  const careful = job.mode === "rescan";

  const keepUrl = (u) => { urls.current.push(u); return u; };
  async function prepare(r) {
    const c = makeSource(img.current, r);
    const prev = cropTo(c, 0, 0, c.width, c.height, 2.2e6);
    const url = keepUrl(URL.createObjectURL(await canvasBlob(prev, "image/jpeg", 0.85)));
    setSrc({ canvas: c, url, w: c.width, h: c.height });
    setCrop({ x: 0, y: 0, w: 1, h: 1 });
    setPhase("crop");
  }
  useEffect(() => {
    let alive = true;
    loadImageFile(job.file)
      .then(({ img: im, url }) => { keepUrl(url); if (!alive) return; img.current = im; return prepare(0); })
      .catch(() => { if (!alive) return; setErr({ title: "Couldn't open that photo", body: "Try a JPEG or PNG, or take a screenshot of the photo and pick that.", retry: false }); setPhase("error"); });
    return () => { alive = false; if (ctl.current) ctl.current.abort(); urls.current.forEach((u) => URL.revokeObjectURL(u)); };
  }, []);
  useEffect(() => {
    if (phase !== "reading") return;
    const t0 = Date.now();
    const t = setInterval(() => setSecs(Math.round((Date.now() - t0) / 1000)), 1000);
    return () => clearInterval(t);
  }, [phase]);

  async function rotate() { const r = (rot + 90) % 360; setRot(r); await prepare(r); }
  async function read() {
    setPhase("reading"); setFound(0); setSecs(0); setErr(null);
    const c = new AbortController();
    ctl.current = c;
    try {
      const sample = await cap("sample");
      if (!sample) throw { code: "capability_disabled" };
      const lim = await sample.limits().catch(() => null);
      if (!lim || !lim.images) throw { code: "images_unavailable" };
      const built = await buildScanImages(src.canvas, crop, lim.images.maxCount || 1);
      keepUrl(built.thumb); setThumb(built.thumb);
      const scan = await runScan({ blobs: built.blobs, layout: built.layout, note, careful, signal: c.signal, onFound: setFound });
      if (c.signal.aborted) return;
      if (!scan.items.length) {
        setErr({ title: "No items found", body: scan.notes || "Claude couldn't find any line items. Try a tighter crop or a sharper photo.", retry: true });
        setPhase("error"); return;
      }
      onResult(scan);
    } catch (e) {
      if (e && e.code === "cancelled") { setPhase("crop"); return; }
      setErr(scanErrorCopy(e)); setPhase("error");
    }
  }

  const title = job.mode === "add" ? "Add a receipt" : job.mode === "rescan" ? "Re-scan receipt" : "New receipt";
  return html`<div class="scan-screen" role="dialog" aria-label=${title}>
    <div class="scan-top">
      <button class="navbtn" onClick=${() => { if (ctl.current) ctl.current.abort(); onCancel(); }}><${Icon} n="chevL" />Cancel</button>
      <span class="st-title">${title}</span>
      ${phase === "crop" ? html`<button class="navbtn" onClick=${rotate} aria-label="Rotate photo"><${Icon} n="rotate" /></button>` : html`<span style="width:44px"></span>`}
    </div>

    ${phase === "loading" && html`<div class="reading"><p class="muted">Opening photo…</p></div>`}

    ${phase === "crop" && src && html`<${Cropper} src=${src} crop=${crop} setCrop=${setCrop} />`}

    ${phase === "reading" && html`<div class="reading" aria-live="polite">
      <div class="thumb">${thumb && html`<img src=${thumb} alt="" />`}</div>
      <h2>Reading the receipt</h2>
      <p class="muted">Claude is itemizing it. This usually takes 15–60 seconds.</p>
      <p class="found">${found ? `${plural(found, "item")} found` : "Looking for items"} · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}</p>
    </div>`}

    ${phase === "error" && html`<div class="reading">
      ${thumb && html`<div class="thumb stopped"><img src=${thumb} alt="" /></div>`}
      <div class="err-box" role="alert"><b>${err && err.title}</b><span>${err && err.body}</span>${err && err.code && html`<span class="mono" style="font-size:.75rem;opacity:.7">Reason: ${err.code}${err.detail ? " · " + err.detail : ""}</span>`}</div>
    </div>`}

    <div class="scan-bottom">
      ${phase === "crop" && html`
        <p class="note" style="text-align:center">Drag the corners so the frame holds just the receipt. A tight crop reads best.</p>
        ${careful && html`<input id="rescan-note" class="inp" placeholder="Anything Claude missed? e.g. the drinks at the bottom" value=${note} onInput=${(e) => setNote(e.target.value)} />`}
        <button class="btn primary block" onClick=${read}><${Icon} n="scan" />Read receipt</button>`}
      ${phase === "reading" && html`<button class="btn block" onClick=${() => ctl.current && ctl.current.abort()}>Stop</button>`}
      ${phase === "error" && html`<div class="row2">
          ${err && err.retry && src && html`<button class="btn primary" onClick=${read}>Try again</button>`}
          ${src && html`<button class="btn" onClick=${() => setPhase("crop")}>Adjust crop</button>`}
        </div>
        ${err && err.code === "images_unavailable" && html`<button class="btn primary block" onClick=${onHowTo}><${Icon} n="receipt" />How to scan with a Claude chat</button>`}
        <button class="btn block" onClick=${() => onPaste(job)}><${Icon} n="copy" />Paste receipt text instead</button>
        ${job.mode !== "rescan" && html`<button class="btn ghost block" onClick=${onManual}>Type the items in instead</button>`}`}
    </div>
  </div>`;
}

/* ================= assigning ================= */
function applyTap(x, people, sel) {
  const ids = people.map((p) => p.id);
  const cur = sharesOf(x, people).map((s) => s.id);
  if (sel.mode === "everyone") {
    if (x.everyone) { x.everyone = false; x.shares = {}; return "cleared"; }
    x.everyone = true; x.shares = {}; return "everyone";
  }
  if (sel.mode === "group") {
    const g = sel.ids.filter((id) => ids.includes(id));
    const same = !x.everyone && cur.length === g.length && g.every((id) => x.shares[id] === 1);
    x.everyone = false;
    if (same) { x.shares = {}; return "cleared"; }
    x.shares = Object.fromEntries(g.map((id) => [id, 1]));
    return "group";
  }
  const pid = sel.ids[0];
  if (!pid || !ids.includes(pid)) return null;
  if (x.everyone) { x.everyone = false; x.shares = Object.fromEntries(ids.filter((id) => id !== pid).map((id) => [id, 1])); return "removed"; }
  if (x.shares[pid]) { delete x.shares[pid]; return cur.length > 1 ? "removed" : "cleared"; }
  x.shares[pid] = 1;
  return cur.length ? "joined" : "assigned";
}
function rowState(it, people, sel) {
  const sh = sharesOf(it, people);
  if (!sh.length) return "";
  if (sel.mode === "everyone") return it.everyone ? "mine" : "taken";
  if (sel.mode === "group") return !it.everyone && sh.length === sel.ids.length && sel.ids.every((id) => it.shares[id] === 1) ? "mine" : "taken";
  return sh.some((s) => s.id === sel.ids[0]) ? "mine" : "taken";
}

function Badges({ it, people }) {
  const sh = sharesOf(it, people);
  const out = [];
  if (it.comped) out.push(html`<span class="badge comp" key="comp">Comped</span>`);
  if (it.everyone && people.length) out.push(html`<span class="badge plain" key="all">Everyone · 1/${people.length} each</span>`);
  else if (sh.length > 3) {
    out.push(html`<span class="badge" key="many">${sh.slice(0, 5).map((s) => { const p = people.find((q) => q.id === s.id); return html`<span class="dot" key=${s.id} style=${{ "--pc": pcolor(p.color), marginRight: "-6px" }}>${firstChar(p.name)}</span>`; })}<span class="bn" style="margin-left:8px">split ${sh.length} ways</span></span>`);
  } else {
    const W = sum(sh.map((s) => s.w));
    for (const s of sh) {
      const p = people.find((q) => q.id === s.id);
      const g = gcd(s.w, W);
      out.push(html`<span class="badge" key=${s.id} style=${{ "--pc": pcolor(p.color) }}><span class="dot">${firstChar(p.name)}</span><span class="bn">${p.name}${sh.length > 1 ? ` · ${s.w / g}/${W / g}` : ""}</span></span>`);
    }
  }
  return out;
}

function Row({ it, bill, sel, onTap, onLong, flash }) {
  const press = usePress(onTap, onLong);
  const people = bill.people;
  const st = people.length ? rowState(it, people, sel) : "";
  const active = sel.mode === "person" ? people.find((p) => p.id === sel.ids[0]) : null;
  const pc = st === "mine" ? (active ? pcolor(active.color) : "var(--accent)") : undefined;
  const cls = ["row", st, itemCost(it) <= 0 ? "free" : "", flash ? "flash" : ""].filter(Boolean).join(" ");
  return html`<button id=${"row-" + it.id} class=${cls} style=${pc ? { "--pc": pc } : null} ...${press}
      aria-pressed=${st === "mine" ? "true" : "false"} aria-label=${`${it.name || "Item"}, ${money(itemCost(it))}`}>
    <span class="row-name">${st === "mine" && html`<span class="tick"><${Icon} n="check" /></span>`}${it.qty > 1 && html`<span class="qty">${it.qty}×</span>`}<span>${it.name || "Untitled item"}</span></span>
    <span class="row-price">${it.comped && html`<s>${money(it.price)}</s>`}${money(itemCost(it))}</span>
    <span class="row-tags">${people.length ? html`<${Badges} it=${it} people=${people} />` : null}</span>
  </button>`;
}

function EditRow({ it, autoFocus, onName, onPrice, onMore, onDelete }) {
  const [name, setName] = useState(it.name);
  const ref = useRef();
  useEffect(() => { if (document.activeElement !== ref.current) setName(it.name); }, [it.name]);
  useLayoutEffect(() => { if (autoFocus && ref.current) { ref.current.focus(); ref.current.scrollIntoView({ block: "center", behavior: "smooth" }); } }, [autoFocus]);
  return html`<div class="erow" id=${"row-" + it.id}>
    <input ref=${ref} id=${"name-" + it.id} class="inp" placeholder="Item name" value=${name} autocomplete="off"
      onInput=${(e) => { setName(e.target.value); onName(e.target.value); }} />
    <${MoneyInput} id=${"price-" + it.id} cents=${it.price} onCommit=${(c) => onPrice(c == null ? 0 : Math.max(0, c))} allowEmpty=${true} />
    <div style="display:flex">
      <button class="icon-btn" aria-label=${"More for " + (it.name || "item")} onClick=${onMore}><${Icon} n="more" /></button>
      <button class="icon-btn" aria-label=${"Delete " + (it.name || "item")} onClick=${onDelete}><${Icon} n="trash" /></button>
    </div>
  </div>`;
}

function AdjRow({ a, base, bill, onOpen }) {
  const amt = adjAmount(a, base);
  const who = a.split === "proportional" ? "Shared by what each person ordered" : (bill.people.find((p) => p.id === a.split) || {}).name || "Shared by what each person ordered";
  return html`<button class="adj-row" onClick=${onOpen}>
    <span class="an">${a.name || (a.kind === "discount" ? "Discount" : "Fee")}${a.mode === "percent" ? ` (${trimNum(a.value || 0)}%)` : ""}</span>
    <span class=${"aa" + (amt < 0 ? " neg" : "")}>${money(amt, { sign: true })}</span>
    <span class="ad">${who}</span>
  </button>`;
}

function CheckLine({ rc, onEdit }) {
  if (!rc || rc.check.status === "none") return null;
  if (rc.check.status === "ok") return html`<div class="check ok"><${Icon} n="check" /><span>Items match the receipt subtotal of ${money(rc.check.subtotal)}.</span></div>`;
  const d = rc.check.diff;
  return html`<div class="check warn"><${Icon} n="alert" /><span>Items add up to ${money(rc.check.sum)}, but the receipt subtotal is ${money(rc.check.subtotal)} (${money(Math.abs(d))} ${d > 0 ? "missing" : "too much"}).
    ${onEdit && html` <button class="text-btn" onClick=${onEdit}>Fix items</button>`}</span></div>`;
}

function PersonChip({ p, on, grp, amt, onTap, onLong }) {
  const press = usePress(onTap, onLong);
  return html`<div class=${"pwrap" + (on ? " on" : "")} style=${{ "--pc": pcolor(p.color) }}>
    <button class=${"pchip" + (on ? " on" : "") + (grp ? " grp" : "")} aria-pressed=${on || grp ? "true" : "false"} ...${press}>
      <span class="pc-name">${p.name}</span><span class="pc-amt">${money(amt)}</span>
    </button><i class="uline"></i></div>`;
}

function PeopleDock({ bill, calc, sel, setSel, openSheet }) {
  const people = bill.people;
  const name = (id) => (people.find((p) => p.id === id) || {}).name || "";
  const tapPerson = (id) => setSel((s) => {
    if (s.mode === "group") {
      const ids = s.ids.includes(id) ? s.ids.filter((x) => x !== id) : [...s.ids, id];
      return ids.length >= 2 ? { mode: "group", ids } : { mode: "person", ids: ids.length ? ids : [id] };
    }
    return { mode: "person", ids: [id] };
  });
  const holdPerson = (id) => setSel((s) => {
    let ids = s.mode === "everyone" ? [] : [...s.ids];
    ids = ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id];
    return ids.length >= 2 ? { mode: "group", ids } : { mode: "person", ids: ids.length ? ids : [id] };
  });
  let hint;
  if (!people.length) hint = html`<span class="dh-text">Add who was at the table to start assigning</span>`;
  else if (sel.mode === "everyone") hint = html`<span class="dh-text">Tap items <b>everyone</b> shared</span>`;
  else if (sel.mode === "group") hint = html`<span class="dh-text">Tap items <b>${sel.ids.map(name).join(" + ")}</b> split</span>`;
  else hint = html`<span class="dh-text">Tap what <b>${name(sel.ids[0])}</b> had</span>`;
  return html`<nav class="dock" aria-label="People at the table"><div class="dock-inner">
    <div class="dock-hint">${hint}
      ${sel.mode === "group" ? html`<button class="text-btn" onClick=${() => setSel({ mode: "person", ids: [sel.ids[0]] })}>Done</button>`
        : people.length >= 2 ? html`<span class="note" style="white-space:nowrap;font-size:.75rem">Hold a name to pick several</span>` : null}
    </div>
    <div class="chips">
      ${people.length >= 2 && html`<div class=${"pwrap" + (sel.mode === "everyone" ? " on" : "")} style=${{ "--pc": "var(--accent)" }}>
        <button class=${"pchip" + (sel.mode === "everyone" ? " on" : "")} aria-pressed=${sel.mode === "everyone" ? "true" : "false"} onClick=${() => setSel({ mode: "everyone", ids: [] })}>
          <span class="pc-name"><${Icon} n="users" />All</span><span class="pc-amt">${plural(people.length, "person", "people")}</span>
        </button><i class="uline"></i></div>`}
      ${people.map((p) => html`<${PersonChip} key=${p.id} p=${p}
        on=${(sel.mode === "person" && sel.ids[0] === p.id)} grp=${sel.mode === "group" && sel.ids.includes(p.id)}
        amt=${calc.per[p.id] ? calc.per[p.id].food : 0}
        onTap=${() => tapPerson(p.id)} onLong=${() => holdPerson(p.id)} />`)}
      <div class="pwrap"><button class=${"pchip addchip" + (people.length ? "" : " pulse")} onClick=${() => openSheet({ type: "people" })}>
        <svg class="outline" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M14 1 H99 V59 H1 V14 Z" vector-effect="non-scaling-stroke" /></svg>
        <span class="pc-name"><${Icon} n="plus" />${people.length ? "Add" : "Add people"}</span>
      </button><i class="uline"></i></div>
    </div>
  </div></nav>`;
}

function ItemsScreen({ bill, calc, mutate, go, openSheet, toast, sel, setSel, editMode, setEditMode, scanAvail, startScan, initialFocus }) {
  const [flashId, setFlashId] = useState(null);
  const [focusId, setFocusId] = useState(initialFocus || null);
  const people = bill.people;
  const prevLeft = useRef(calc.left);
  useEffect(() => {
    if (prevLeft.current > 0 && calc.left === 0 && calc.complete && !editMode) toast("Everything is assigned", { label: "Tax & tip", fn: () => go("tip") });
    prevLeft.current = calc.left;
  }, [calc.left]);

  const tap = (it) => {
    if (!people.length) { openSheet({ type: "people" }); return; }
    let res = null;
    mutate((b) => { const l = findItem(b, it.id); if (l) res = applyTap(l.it, b.people, sel); });
    const nm = it.name || "This item";
    if (res === "joined") toast(`${nm} is now split ${sharesOf(findItem(billRefGlobal.current, it.id).it, people).length} ways`, { label: "Undo", fn: () => undoGlobal() });
    else if (res === "removed") toast(`${(people.find((p) => p.id === sel.ids[0]) || {}).name} taken off ${nm}`, { label: "Undo", fn: () => undoGlobal() });
    else if (res === "everyone") toast(`${nm} split between everyone`);
  };
  const jumpToLeft = () => {
    if (!calc.firstLeft) return;
    if (editMode) setEditMode(false);
    setTimeout(() => {
      const el = document.getElementById("row-" + calc.firstLeft);
      if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
      setFlashId(calc.firstLeft);
      setTimeout(() => setFlashId(null), 1200);
    }, 30);
  };
  const addItem = (rid) => {
    const it = newItem();
    mutate((b) => { const r = b.receipts.find((x) => x.id === rid); if (r) r.items.push(it); });
    if (!editMode) setEditMode(true);
    setFocusId(it.id);
  };
  const addAdj = (rid) => {
    const a = newAdj();
    mutate((b) => { const r = b.receipts.find((x) => x.id === rid); if (r) r.adjustments.push(a); });
    openSheet({ type: "adj", id: a.id, fresh: true });
  };
  const delItem = (it) => {
    mutate((b) => { const l = findItem(b, it.id); if (l) l.r.items.splice(l.index, 1); });
    toast(`Deleted ${it.name || "item"}`, { label: "Undo", fn: () => undoGlobal() });
  };
  const pct = calc.required ? Math.round((calc.assigned / calc.required) * 100) : 0;

  return html`<main class="app with-dock">
    <header class="topbar">
      <div class="tb-left"><button class="navbtn" onClick=${() => go("home")}><${Icon} n="chevL" />Bills</button></div>
      <button class="tb-title" onClick=${() => openSheet({ type: "bill" })}>${billTitle(bill)}</button>

        <div class="receipt-head">

            <div class="rh-meta">${[r.date ? fmtDate(new Date(r.date + "T12:00:00"), true) : null, plural(r.items.length, "item"), money(rc ? rc.orig : 0)].filter(Boolean).join(" · ")}</div>
          </button>
          <button class="icon-btn" aria-label="Receipt details" onClick=${() => openSheet({ type: "receipt", id: r.id })}><${Icon} n="more" /></button>
        </div>
        <${CheckLine} rc=${rc} onEdit=${editMode ? null : () => setEditMode(true)} />
        <div class="rows">
          ${r.items.length === 0 && html`<div class="empty"><b>No items yet</b><span>Add each line from the receipt with its price.</span></div>`}
          ${r.items.map((it) => editMode
            ? html`<${EditRow} key=${it.id} it=${it} autoFocus=${focusId === it.id}
                onName=${(v) => mutate((b) => { const l = findItem(b, it.id); if (l) l.it.name = v; }, { coalesce: "name-" + it.id })}
                onPrice=${(c) => mutate((b) => { const l = findItem(b, it.id); if (l) l.it.price = c; }, { coalesce: "price-" + it.id })}

        </div>
      </section>`;

    <div class="add-receipt">
