    </div>

    <${PeopleDock} bill=${bill} calc=${calc} sel=${sel} setSel=${setSel} openSheet=${openSheet} />
  </main>`;
}

/* ================= sheets ================= */
const shareKey = (x) => JSON.stringify([!!x.everyone, Object.entries(x.shares || {}).filter(([, w]) => w > 0).sort()]);

function ItemSheet({ bill, id, mutate, close, toast }) {
  const loc = findItem(bill, id);
  const [name, setName] = useState(loc ? loc.it.name : "");
  useEffect(() => { if (!loc) close(); }, [!!loc]);
  if (!loc) return null;
  const { r, it } = loc;
  const people = bill.people;
  const sh = sharesOf(it, people);
  const wOf = Object.fromEntries(sh.map((s) => [s.id, s.w]));
  const al = allocate(itemCost(it), sh.map((s) => s.w));
  const amtOf = Object.fromEntries(sh.map((s, k) => [s.id, al[k]]));
  const unit = Math.round(it.price / (it.qty || 1));
  const twins = r.items.filter((x) => x.id !== it.id && x.name.trim() && norm(x.name) === norm(it.name) && Math.round(x.price / (x.qty || 1)) === unit && !!x.comped === !!it.comped);
  const set = (fn, coalesce) => mutate((b) => { const l = findItem(b, id); if (l) fn(l.it, l.r, b); }, coalesce ? { coalesce } : {});
  const explicit = (x) => { if (x.everyone) { x.everyone = false; x.shares = Object.fromEntries(people.map((p) => [p.id, 1])); } };
  const toggle = (pid) => set((x) => { explicit(x); if (x.shares[pid]) delete x.shares[pid]; else x.shares[pid] = 1; });
  const weight = (pid, w) => set((x) => { explicit(x); x.shares[pid] = w; });

  const splitUnits = () => {
    set((x, rr) => {
      const g = "g" + uid();
      const units = allocate(x.price, Array(x.qty).fill(1)).map((p) => newItem({ name: x.name, price: p, comped: x.comped, everyone: x.everyone, shares: { ...x.shares }, groupId: g }));
      rr.items.splice(rr.items.findIndex((y) => y.id === x.id), 1, ...units);
    });
    toast(`Split into ${it.qty} separate items`, { label: "Undo", fn: () => undoGlobal() });
    close();
  };
  const merge = () => {
    let kept = true;
    set((x, rr) => {
      const group = [x, ...rr.items.filter((y) => twins.some((t) => t.id === y.id))];
      const same = group.every((g) => shareKey(g) === shareKey(x));
      const singles = group.every((g) => !g.everyone && Object.values(g.shares).filter((w) => w > 0).length === 1);
      const shares = {};
      if (!same && singles) for (const g of group) { const pid = Object.keys(g.shares).find((k) => g.shares[k] > 0); shares[pid] = (shares[pid] || 0) + (g.qty || 1); }
      x.qty = sum(group.map((g) => g.qty || 1));
      x.price = sum(group.map((g) => g.price));
      if (!same) { x.everyone = false; x.shares = singles ? shares : {}; kept = singles; }
      const gone = new Set(group.slice(1).map((g) => g.id));
      rr.items = rr.items.filter((y) => !gone.has(y.id));
    });
    toast(kept ? `Merged into one line` : `Merged. Assign it again`, { label: "Undo", fn: () => undoGlobal() });
  };
  const duplicate = () => {
    set((x, rr) => { rr.items.splice(rr.items.findIndex((y) => y.id === x.id) + 1, 0, newItem({ name: x.name, price: x.price, qty: x.qty })); });
    toast(`Added another ${it.name || "item"}`);
  };
  const remove = () => {
    mutate((b) => { const l = findItem(b, id); if (l) l.r.items.splice(l.index, 1); });
    toast(`Deleted ${it.name || "item"}`, { label: "Undo", fn: () => undoGlobal() });
    close();
  };

  return html`<${Sheet} title=${it.name || "Item"} onClose=${close}>
    <div class="field"><label for="is-name">Name</label>
      <input id="is-name" class="inp" value=${name} autocomplete="off" onInput=${(e) => { setName(e.target.value); set((x) => { x.name = e.target.value; }, "name-" + id); }} /></div>
    <div class="field-row">
      <div class="field"><label for="is-price">${it.qty > 1 ? "Line total" : "Price"}</label>
        <${MoneyInput} id="is-price" cents=${it.price} onCommit=${(c) => set((x) => { x.price = Math.max(0, c || 0); }, "price-" + id)} /></div>
      <div class="field"><span class="flabel">Quantity</span>
        <div style="display:flex;align-items:center;gap:10px"><${Stepper} label="Quantity" value=${it.qty || 1} min=${1} max=${50} onChange=${(q) => set((x) => { x.price = unit * q; x.qty = q; })} />
        ${it.qty > 1 && html`<span class="note num">${money(unit)} each</span>`}</div></div>
    </div>
    <button class="switch-row" onClick=${() => set((x) => { x.comped = !x.comped; })} aria-pressed=${it.comped ? "true" : "false"}>
      <span><b>Comped</b><br /><span class="note">The restaurant took it off the bill</span></span><span class=${"switch" + (it.comped ? " on" : "")}></span>
    </button>

    ${people.length > 0 && html`<div class="field">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span class="flabel">Who had it?</span>
        <div style="display:flex;gap:2px">
          <button class="text-btn" onClick=${() => set((x) => { x.everyone = !x.everyone; x.shares = {}; })}>${it.everyone ? "Not everyone" : "Everyone"}</button>
          ${sh.length > 0 && html`<button class="text-btn" onClick=${() => set((x) => { x.everyone = false; x.shares = {}; })}>Clear</button>`}
        </div>
      </div>
      <div class="pick-list">
        ${people.map((p) => {
          const on = !!wOf[p.id];
          return html`<div key=${p.id} class=${"pick" + (on ? " on" : "")} style=${{ "--pc": pcolor(p.color) }}>
            <button class="pk" onClick=${() => toggle(p.id)} aria-pressed=${on ? "true" : "false"}>
              <span class="box"><${Icon} n="check" /></span><span class="pn">${p.name}</span>
            </button>
            <span class="pr">
              ${on && sh.length > 1 && html`<${Stepper} label=${"Shares for " + p.name} value=${wOf[p.id]} min=${1} max=${9} onChange=${(w) => weight(p.id, w)} />`}
              <span class="pamt">${on ? money(amtOf[p.id]) : ""}</span>
            </span>
          </div>`;
        })}
      </div>
      ${sh.length > 1 && html`<span class="hint">Shares set uneven splits: 2 shares pays twice as much as 1.</span>`}
    </div>`}

    <div class="sheet-tools">
      ${it.qty > 1 && html`<button class="text-btn" onClick=${splitUnits}><${Icon} n="split" />Split into ${it.qty} separate items</button>`}
      ${twins.length > 0 && html`<button class="text-btn" onClick=${merge}><${Icon} n="merge" />Merge ${twins.length + 1} matching items into one line</button>`}
      <button class="text-btn" onClick=${duplicate}><${Icon} n="dup" />Add another one</button>
      <button class="text-btn danger" onClick=${remove}><${Icon} n="trash" />Delete item</button>
    </div>
    <div class="sheet-actions"><button class="btn primary" onClick=${close}>Done</button></div>
  <//>`;
}

function AdjSheet({ bill, id, fresh, mutate, close, toast }) {
  const loc = findAdj(bill, id);
  const [name, setName] = useState(loc ? loc.a.name : "");
  useEffect(() => { if (!loc) close(); }, [!!loc]);
  if (!loc) return null;
  const { a, r } = loc;
  const base = sum(r.items.map(itemCost));
  const set = (fn, coalesce) => mutate((b) => { const l = findAdj(b, id); if (l) fn(l.a, b); }, coalesce ? { coalesce } : {});
  const remove = () => { mutate((b) => { const l = findAdj(b, id); if (l) l.r.adjustments.splice(l.index, 1); }); close(); };
  const done = () => { if (!a.value && !a.name.trim()) remove(); else close(); };
  const amt = adjAmount(a, base);
  return html`<${Sheet} title=${fresh ? "Fee or discount" : a.name || "Fee or discount"} onClose=${done}>
    <div class="field"><span class="flabel">Type</span>
      <div class="seg" role="group" aria-label="Type">
        <button aria-pressed=${a.kind === "fee" ? "true" : "false"} onClick=${() => set((x) => { x.kind = "fee"; })}>Fee or charge</button>
        <button aria-pressed=${a.kind === "discount" ? "true" : "false"} onClick=${() => set((x) => { x.kind = "discount"; })}>Discount</button>
      </div></div>
    <div class="field"><label for="as-name">Name</label>
      <input id="as-name" class="inp" placeholder=${a.kind === "discount" ? "Happy hour, coupon…" : "Service charge, kitchen fee…"} value=${name} autocomplete="off"
        onInput=${(e) => { setName(e.target.value); set((x) => { x.name = e.target.value; }, "aname-" + id); }} /></div>
    <div class="field"><span class="flabel">Amount</span>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center">
        ${a.mode === "percent"
          ? html`<${PctInput} id="as-pct" value=${a.value || null} onCommit=${(v) => set((x) => { x.value = v || 0; }, "aval-" + id)} />`
          : html`<${MoneyInput} id="as-amt" cents=${a.value || null} autoFocus=${fresh} onCommit=${(c) => set((x) => { x.value = Math.abs(c || 0); }, "aval-" + id)} />`}
        <div class="seg" role="group" aria-label="Amount type" style="width:112px">
          <button aria-pressed=${a.mode !== "percent" ? "true" : "false"} onClick=${() => set((x) => { x.mode = "amount"; x.value = 0; })}>${currencySymbol()}</button>
          <button aria-pressed=${a.mode === "percent" ? "true" : "false"} onClick=${() => set((x) => { x.mode = "percent"; x.value = 0; })}>%</button>
        </div>
      </div>
      ${a.mode === "percent" && html`<span class="hint">${money(Math.abs(amt))} on ${money(base)} of items</span>`}
    </div>
    <div class="field"><span class="flabel">Who pays it</span>
      <div class="pick-list">
        ${[{ id: "proportional", name: "Everyone, by what they ordered", color: null }, ...bill.people].map((p) => {
          const on = a.split === p.id || (p.id === "proportional" && !bill.people.some((q) => q.id === a.split));
          return html`<div key=${p.id} class=${"pick" + (on ? " on" : "")} style=${{ "--pc": p.color == null ? "var(--accent)" : pcolor(p.color) }}>
            <button class="pk" onClick=${() => set((x) => { x.split = p.id; })} aria-pressed=${on ? "true" : "false"}>
              <span class="box" style="border-radius:50%"><${Icon} n="check" /></span><span class="pn">${p.name}</span>
            </button><span></span></div>`;
        })}
      </div></div>
    <div class="sheet-actions">
      <button class="btn danger" onClick=${() => { remove(); toast("Removed", { label: "Undo", fn: () => undoGlobal() }); }}><${Icon} n="trash" />Remove</button>
      <button class="btn primary" onClick=${done}>Done</button>
    </div>
  <//>`;
}

function PeopleSheet({ bill, mutate, close, setSel, toast }) {
  const [txt, setTxt] = useState("");
  const [confirm, setConfirm] = useState(null);
  const ref = useRef();
  useLayoutEffect(() => { if (ref.current && !bill.people.length) ref.current.focus(); }, []);
  const add = () => {
    const names = txt.split(/[,\n]/).map((s) => s.trim()).filter(Boolean);
    if (!names.length) return;
    let first = null, skipped = 0;
    const hadPeople = bill.people.length > 0;
    mutate((b) => {
      for (const n of names) {
        if (b.people.some((p) => norm(p.name) === norm(n))) { skipped++; continue; }
        const p = { id: "p" + uid(), name: n.slice(0, 28), color: nextColor(b.people), me: false };
        if (Store.settings.meName && norm(Store.settings.meName) === norm(n) && !b.people.some((q) => q.me)) p.me = true;
        b.people.push(p);
        if (!first) first = p.id;
      }
    });
    setTxt("");
    if (first && !hadPeople) setSel({ mode: "person", ids: [first] });
    if (skipped) toast(`${plural(skipped, "name")} already at the table`);
    if (ref.current) ref.current.focus();
  };
  const assignedCount = (pid) => sum(bill.receipts.map((r) => r.items.filter((it) => it.everyone || (it.shares && it.shares[pid])).length));
  const remove = (pid) => {
    mutate((b) => {
      b.people = b.people.filter((p) => p.id !== pid);
      for (const r of b.receipts) {
        for (const it of r.items) if (it.shares) delete it.shares[pid];
        for (const a of r.adjustments) if (a.split === pid) a.split = "proportional";
      }
      if (b.paid) delete b.paid[pid];
    });
    setSel((s) => ({ mode: s.mode, ids: s.ids.filter((x) => x !== pid) }));
    setConfirm(null);
  };
  const toggleMe = (p) => {
    const becomes = !p.me;
    mutate((b) => { for (const q of b.people) q.me = q.id === p.id ? becomes : false; });
    Store.setSetting({ meName: becomes ? p.name : "" });
  };
  return html`<${Sheet} title="People at the table" lead="Add everyone who's splitting. Separate names with commas to add a few at once." onClose=${close}>
    <form class="add-people" onSubmit=${(e) => { e.preventDefault(); add(); }}>
      <input id="ps-add" ref=${ref} class="inp" placeholder="alex, sam, jordan" value=${txt} autocomplete="off" autocapitalize="words" enterkeyhint="done" onInput=${(e) => setTxt(e.target.value)} />
      <button class="btn primary sm" type="submit" style="min-height:46px" disabled=${!txt.trim()}>Add</button>
    </form>
    ${bill.people.length > 0 && html`<div class="people-edit">
      ${bill.people.map((p) => html`<div key=${p.id} style="display:grid;gap:6px">
        <div class="prow" style=${{ "--pc": pcolor(p.color) }}>
          <span class="pdot"></span>
          <${NameInput} id=${"pn-" + p.id} value=${p.name} onCommit=${(v) => { mutate((b) => { const q = b.people.find((x) => x.id === p.id); if (q) q.name = v; }, { coalesce: "pname-" + p.id }); if (p.me) Store.setSetting({ meName: v }); }} />
          <button class="me-btn" aria-pressed=${p.me ? "true" : "false"} onClick=${() => toggleMe(p)}>${p.me ? "Me" : "Is me?"}</button>
          <button class="icon-btn" aria-label=${"Remove " + p.name} onClick=${() => (assignedCount(p.id) ? setConfirm(p.id) : remove(p.id))}><${Icon} n="trash" /></button>
        </div>
        ${confirm === p.id && html`<div class="confirm-inline"><span>Remove ${p.name}? ${plural(assignedCount(p.id), "item")} they had will need a new owner.</span>
          <button class="btn sm" onClick=${() => setConfirm(null)}>Keep</button><button class="btn sm primary" onClick=${() => remove(p.id)}>Remove</button></div>`}
      </div>`)}
      <span class="note" style="margin-top:6px">Mark yourself with “Is me?” so you're left out of what people owe you.</span>
    </div>`}
    <div class="sheet-actions"><button class="btn primary" onClick=${close}>Done</button></div>
  <//>`;
}
function NameInput({ id, value, onCommit, allowEmpty, placeholder }) {
  const [v, setV] = useState(value);
  const ref = useRef();
  useEffect(() => { if (document.activeElement !== ref.current) setV(value); }, [value]);
  return html`<input id=${id} ref=${ref} class="inp" value=${v} placeholder=${placeholder} autocomplete="off" onInput=${(e) => { setV(e.target.value); if (allowEmpty || e.target.value.trim()) onCommit(e.target.value.trim().slice(0, allowEmpty ? 60 : 28)); }} />`;
}

function ReceiptSheet({ bill, id, mutate, close, startScan, scanAvail, toast }) {
  const idx = bill.receipts.findIndex((r) => r.id === id);

  const [confirm, setConfirm] = useState(false);

  if (!r) return null;
  const set = (fn, coalesce) => mutate((b) => { const x = b.receipts.find((q) => q.id === id); if (x) fn(x); }, coalesce ? { coalesce } : {});
  const txt = (key, label, ph) => html`<div class="field"><label for=${"rs-" + key}>${label}</label>
    <${NameInput} id=${"rs-" + key} value=${r[key] || ""} placeholder=${ph} allowEmpty=${true} onCommit=${(v) => set((x) => { x[key] = v; }, "r" + key + id)} /></div>`;
  return html`<${Sheet} title=${receiptName(r, idx)} onClose=${close}>
    ${r.notes && html`<div class="check warn" style="margin-bottom:14px"><${Icon} n="alert" /><span>Claude's note: ${r.notes}</span></div>`}
    <div class="field-row">${txt("merchant", "Restaurant", "Restaurant name")}${txt("location", "Location", "City or neighborhood")}</div>
    <div class="field"><label for="rs-date">Date</label>
      <input id="rs-date" type="date" class="inp" value=${r.date || ""} onInput=${(e) => set((x) => { x.date = validDate(e.target.value); })} /></div>
    <div class="field-row">
      <div class="field"><label for="rs-sub">Subtotal on receipt</label><${MoneyInput} id="rs-sub" cents=${r.subtotal} placeholder="Not printed" onCommit=${(c) => set((x) => { x.subtotal = c; }, "rsub" + id)} /></div>
      <div class="field"><label for="rs-tax">Tax</label><${MoneyInput} id="rs-tax" cents=${r.taxMode === "amount" ? r.tax : null} placeholder=${r.taxMode === "rate" && r.taxRate != null ? trimNum(r.taxRate) + "% rate" : "Not printed"} onCommit=${(c) => set((x) => { x.taxMode = "amount"; x.tax = c; }, "rtax" + id)} /></div>
      <div class="field"><label for="rs-tip">Tip on receipt</label><${MoneyInput} id="rs-tip" cents=${r.printedTip} placeholder="None" onCommit=${(c) => set((x) => { x.printedTip = c; }, "rtip" + id)} /></div>
      <div class="field"><label for="rs-total">Total on receipt</label><${MoneyInput} id="rs-total" cents=${r.total} placeholder="Not printed" onCommit=${(c) => set((x) => { x.total = c; }, "rtot" + id)} /></div>
    </div>

function RescanSheet({ bill, receiptId, scan, mutate, close, toast }) {
  const r = bill.receipts.find((x) => x.id === receiptId);
  const units = useMemo(() => {
    const pool = r ? r.items.map((x) => ({ k: norm(x.name), p: x.price, used: false })) : [];
    return itemsFromScan(scan.items).map((u) => {
      const m = pool.find((q) => !q.used && q.k === norm(u.name) && q.p === u.price);
      if (m) m.used = true;
      return { u, isNew: !m };
    });
  }, []);
  const [picked, setPicked] = useState(() => new Set(units.filter((x) => x.isNew).map((x) => x.u.id)));
  if (!r) return null;
  const toggle = (id) => setPicked((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const fill = (x) => {
    if (x.subtotal == null) x.subtotal = scan.subtotal;
    if (x.total == null) x.total = scan.total;
    if (!x.merchant) x.merchant = scan.merchant;
    if (!x.date) x.date = scan.date;
    if (x.taxMode === "amount" && x.tax == null && scan.tax != null) x.tax = scan.tax;
  };
  const addPicked = () => {
    const add = units.filter((x) => picked.has(x.u.id)).map((x) => clone(x.u));
    mutate((b) => { const x = b.receipts.find((q) => q.id === receiptId); if (x) { x.items.push(...add); fill(x); } });
    toast(`Added ${plural(add.length, "item")}`, { label: "Undo", fn: () => undoGlobal() });
    close();
  };
  const replaceAll = () => {
    mutate((b) => {
      const x = b.receipts.find((q) => q.id === receiptId);
      if (!x) return;
      const old = x.items.slice();
      x.items = units.map(({ u }) => {
        const i = old.findIndex((o) => norm(o.name) === norm(u.name) && o.price === u.price);
        if (i < 0) return clone(u);
        const o = old.splice(i, 1)[0];
        return { ...clone(u), id: o.id, everyone: o.everyone, shares: { ...o.shares }, comped: o.comped };
      });
      x.subtotal = scan.subtotal ?? x.subtotal; x.total = scan.total ?? x.total;
      if (scan.tax != null) { x.taxMode = "amount"; x.tax = scan.tax; }
      if (scan.tip) x.printedTip = scan.tip;
      if (scan.notes) x.notes = scan.notes;
    });
    toast("Items replaced", { label: "Undo", fn: () => undoGlobal() });
    close();
  };
  return html`<${Sheet} title="New scan" lead=${`Claude found ${plural(units.length, "item")} (${money(sum(units.map((x) => x.u.price)))}). Items already on your list are unchecked.`} onClose=${close}>
    <div class="pick-list">
      ${units.map(({ u, isNew }) => html`<div key=${u.id} class=${"pick" + (picked.has(u.id) ? " on" : "")} style=${{ "--pc": "var(--accent)" }}>
        <button class="pk" onClick=${() => toggle(u.id)} aria-pressed=${picked.has(u.id) ? "true" : "false"}>
          <span class="box"><${Icon} n="check" /></span><span class="pn">${u.name}</span>
        </button>
        <span class="pr">${!isNew && html`<span class="pill">listed</span>`}<span class="pamt">${money(u.price)}</span></span>
      </div>`)}
    </div>
    <div class="sheet-actions">
      <button class="btn" onClick=${replaceAll}>Replace all items</button>
      <button class="btn primary" disabled=${!picked.size} onClick=${addPicked}>Add ${plural(picked.size, "item")}</button>
    </div>
  <//>`;
}

function OwedSheet({ bills, nameKey, close, toast }) {
  const o = owedByName(bills).find((x) => x.key === nameKey);
  useEffect(() => { if (!o) close(); }, [!!o]);

  const markPaid = (entries) => {
    for (const e of entries) {

      const c = clone(b);

  return html`<${Sheet} title=${o.name} lead=${`Owes you ${money(o.total)} across ${plural(o.entries.length, "bill")}.`} onClose=${close}>

function PasteSheet({ job, close, onResult }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [found, setFound] = useState(0);
  const [err, setErr] = useState(null);
  const [copied, setCopied] = useState("");
  const ctl = useRef(null);
  const chatPrompt = scanPrompt({ overview: true, tiles: 0 }, null);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const go = async () => {
    setErr(null);
    const direct = parsePastedJson(text);
    if (direct) { onResult(direct); return; }
    if (text.replace(/[^A-Za-z0-9]/g, "").length < 12) { setErr({ title: "Paste the receipt text first" }); return; }
    const c = new AbortController();
    ctl.current = c;
    setBusy(true); setFound(0);
    try {
      const scan = await runTextScan({ text, careful: job.mode === "rescan", signal: c.signal, onFound: setFound });
      if (c.signal.aborted) return;
      if (!scan.items.length) { setErr({ title: "No items found", body: scan.notes || "Claude couldn't find line items in that text." }); return; }
      onResult([scan]);
    } catch (e) {
      if (!(e && e.code === "cancelled")) setErr(scanErrorCopy(e));
    } finally { setBusy(false); }
  };
  return html`<${Sheet} title="Paste receipt text" lead="Paste the receipt's text, or Claude's answer from a chat. The items come out the same way as a scan." onClose=${close}>
    <textarea id="paste-text" class="inp" style="min-height:170px" placeholder=${"CALAMARI          15.00\nMORAN'S SPECIAL   12.00\n…"} value=${text} onInput=${(e) => setText(e.target.value)}></textarea>
    ${err && html`<div class="err-box" style="margin-top:10px;max-width:none" role="alert"><b>${err.title}</b>${err.body && html`<span>${err.body}</span>`}${err.code && html`<span class="mono" style="font-size:.75rem;opacity:.7">Reason: ${err.code}</span>`}</div>`}
    <div class="sheet-actions">
      ${busy
        ? html`<button class="btn block" onClick=${() => ctl.current && ctl.current.abort()}>Stop · ${found ? `${plural(found, "item")} found` : "Itemizing with Claude"}</button>`
        : html`<button class="btn primary block" disabled=${!text.trim()} onClick=${go}><${Icon} n="scan" />Get items</button>`}
    </div>
    <div class="paste-help">
      <span class="flabel">Ways to get the text</span>
      <ol>
        <li><b>iPhone camera:</b> tap the box above, choose <b>Scan Text</b> from the menu, and point it at the receipt.</li>
        <li><b>A Claude chat:</b> with the Receipt Split skill on, send the receipt photo and copy the code block from Claude's reply. Without the skill, copy the instructions below, attach the photo, paste them and send.</li>
      </ol>
      <button class="btn sm" onClick=${async () => setCopied((await copyText(chatPrompt)) ? "ok" : "fail")}><${Icon} n="copy" />${copied === "ok" ? "Instructions copied" : "Copy instructions for Claude"}</button>
      ${copied === "fail" && html`<textarea class="inp copy-box" readonly value=${chatPrompt} onFocus=${(e) => e.target.select()}></textarea><span class="note">Copying isn't allowed here. Select the text above and copy it.</span>`}
    </div>
  <//>`;
}

function ImageSheet({ blob, filename, close, toast }) {

/* ================= tax & tip ================= */
function TaxRow({ r, i, rc, single, mutate }) {
  const set = (fn, co) => mutate((b) => { const x = b.receipts.find((q) => q.id === r.id); if (x) fn(x); }, co ? { coalesce: co } : {});
  const base = rc ? rc.base : 0;
  const missing = !rc || rc.tax == null;
  const rate = r.taxMode === "rate" ? r.taxRate : r.tax != null && base > 0 ? (r.tax / base) * 100 : null;
  const last = Store.settings.lastTaxRate;
  const sub = r.taxMode === "rate"
    ? (rc && rc.tax != null ? `${money(rc.tax)} on ${money(base)}` : `on ${money(base)}`)
    : (rate != null && r.tax ? `${trimNum(Math.round(rate * 1000) / 1000)}% of ${money(base)}` : `on ${money(base)}`);
  return html`<div class="tax-rec">
    <div class="tax-line">
      <div style="min-width:0"><div class="tl-name">${single ? "Sales tax" : receiptName(r, i)}</div><div class="tl-sub num">${sub}</div></div>
      ${r.taxMode === "rate"
        ? html`<${PctInput} id=${"tax-rate-" + r.id} value=${r.taxRate} placeholder="Rate" onCommit=${(v) => { set((x) => { x.taxRate = v; }, "taxrate" + r.id); if (v != null && v > 0 && v < 30) Store.setSetting({ lastTaxRate: v }); }} />`
        : html`<${MoneyInput} id=${"tax-amt-" + r.id} cents=${r.tax} placeholder="Amount" onCommit=${(c) => set((x) => { x.tax = c == null ? null : Math.max(0, c); }, "taxamt" + r.id)} />`}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div class="seg" role="group" aria-label="Enter tax as" style="width:180px">
        <button aria-pressed=${r.taxMode !== "rate" ? "true" : "false"} onClick=${() => set((x) => { if (x.taxMode === "rate") x.tax = x.taxRate != null ? Math.round((Math.max(0, base) * x.taxRate) / 100) : null; x.taxMode = "amount"; })}>Amount</button>
        <button aria-pressed=${r.taxMode === "rate" ? "true" : "false"} onClick=${() => set((x) => { if (x.taxMode !== "rate") x.taxRate = x.tax != null && base > 0 ? Math.round((x.tax / base) * 100000) / 1000 : x.taxRate; x.taxMode = "rate"; })}>Rate %</button>
      </div>
      ${missing && last != null && html`<button class="chip-btn" onClick=${() => set((x) => { x.taxMode = "rate"; x.taxRate = last; })}>Use ${trimNum(last)}%</button>`}
      ${missing && html`<button class="chip-btn" onClick=${() => set((x) => { x.taxMode = "amount"; x.tax = 0; })}>No tax</button>`}
    </div>
    ${missing && html`<div class="check warn"><${Icon} n="alert" /><span>No tax found on this receipt. Enter the amount or the rate.</span></div>`}
  </div>`;
}

function TaxTipScreen({ bill, calc, mutate, go }) {
  const tip = bill.tip || { mode: "percent", percent: 20 };
  const [custom, setCustom] = useState(() => tip.mode === "percent" && ![18, 20, 22].includes(tip.percent));
  const setTip = (patch, co) => mutate((b) => { b.tip = { ...b.tip, ...patch }; }, co ? { coalesce: co } : {});
  const canGo = calc.complete && !calc.taxMissing;
  const next = () => {
    const r = bill.receipts[0], rc = calc.receipts[0];
    if (r && rc) {
      const rate = r.taxMode === "rate" ? r.taxRate : r.tax && rc.base > 0 ? Math.round((r.tax / rc.base) * 100000) / 1000 : null;
      if (rate && rate > 0 && rate < 30) Store.setSetting({ lastTaxRate: rate });
    }
    go("summary");
  };
  const fees = bill.receipts.flatMap((r, i) => r.adjustments.map((a) => ({ a, amt: adjAmount(a, calc.receipts[i] ? calc.receipts[i].items : 0) })));
  const alt = [["amount", "Dollar amount"], ...(calc.printedTip ? [["printed", `On receipt · ${money(calc.printedTip)}`]] : []), ["none", "No tip"]];
  const totalsKnown = bill.receipts.length > 0 && bill.receipts.every((r) => r.total != null);
  const receiptTotals = sum(bill.receipts.map((r) => r.total || 0)) + (calc.tipMode === "printed" ? 0 : calc.tip);
  return html`<main class="app">
    <header class="topbar">
      <div class="tb-left"><button class="navbtn" onClick=${() => go("items")}><${Icon} n="chevL" />Items</button></div>
      <span class="tb-title">Tax & Tip</span>
      <div class="tb-right"><button class="navbtn go" disabled=${!canGo} onClick=${next}>Split<${Icon} n="chevR" /></button></div>
    </header>
    <div class="stack">
      <section class="card" aria-labelledby="tax-h">
        <div class="card-head"><h2 class="card-title" id="tax-h">Tax</h2><span class="note num">${money(calc.tax)}</span></div>
        ${bill.receipts.map((r, i) => html`<${TaxRow} key=${r.id} r=${r} i=${i} rc=${calc.receipts[i]} single=${bill.receipts.length === 1} mutate=${mutate} />`)}
        <span class="note">Each person pays tax in proportion to what they ordered.</span>
      </section>

      <section class="card" aria-labelledby="tip-h">
        <div class="card-head"><h2 class="card-title" id="tip-h">Tip</h2><span class="note num">on ${money(calc.food)} before tax</span></div>
        <div class="opts">
          ${[18, 20, 22].map((p) => html`<button key=${p} class="opt" aria-pressed=${tip.mode === "percent" && !custom && tip.percent === p ? "true" : "false"} onClick=${() => { setCustom(false); setTip({ mode: "percent", percent: p }); }}>${p}%</button>`)}
          <button class="opt" aria-pressed=${tip.mode === "percent" && custom ? "true" : "false"} onClick=${() => { setCustom(true); setTip({ mode: "percent" }); }}>Custom</button>
        </div>
        ${tip.mode === "percent" && custom && html`<div class="field" style="margin:0"><label for="tip-pct">Tip percent</label>
          <${PctInput} id="tip-pct" value=${tip.percent} onCommit=${(v) => setTip({ percent: v == null ? 0 : Math.min(v, 100) }, "tippct")} /></div>`}
        <div class="opts small" style=${{ gridTemplateColumns: `repeat(${alt.length}, minmax(0, 1fr))` }}>
          ${alt.map(([m, label]) => html`<button key=${m} class="opt" aria-pressed=${calc.tipMode === m ? "true" : "false"} onClick=${() => setTip({ mode: m })}>${label}</button>`)}
        </div>
        ${tip.mode === "amount" && html`<div class="field" style="margin:0"><label for="tip-amt">Total tip for the table</label>
          <${MoneyInput} id="tip-amt" cents=${tip.amount} autoFocus=${!tip.amount} onCommit=${(c) => setTip({ amount: c == null ? null : Math.max(0, c) }, "tipamt")} /></div>`}
        <div class="line"><span>Tip</span><b class="num">${money(calc.tip)}${calc.food > 0 && calc.tip > 0 ? ` · ${(Math.round((calc.tip / calc.food) * 1000) / 10).toString()}%` : ""}</b></div>
        <span class="note">Split by what each person ordered: someone with a $100 order pays 20 times the tip of someone with a $5 one.</span>
      </section>

      ${fees.length > 0 && html`<section class="card" aria-labelledby="fee-h">
        <div class="card-head"><h2 class="card-title" id="fee-h">Fees & discounts</h2><button class="text-btn" onClick=${() => go("items")}>Edit</button></div>
        <div class="lines">${fees.map(({ a, amt }) => html`<div class="line" key=${a.id}><span>${a.name || (a.kind === "discount" ? "Discount" : "Fee")}${a.split !== "proportional" ? ` · ${(bill.people.find((p) => p.id === a.split) || {}).name || ""}` : ""}</span><span>${money(amt, { sign: true })}</span></div>`)}</div>
      </section>`}

      <section class="card" aria-labelledby="split-h">
        <div class="card-head"><h2 class="card-title" id="split-h">Each person</h2></div>
        ${calc.complete
          ? html`<div class="mini-people">${bill.people.map((p) => html`<div class="line" key=${p.id} style=${{ "--pc": pcolor(p.color) }}><span><i class="pdot"></i>${p.name}</span><b>${money(calc.per[p.id].total)}</b></div>`)}</div>`
          : html`<p class="note">Assign every item to see each person's total.</p>`}
        <div class="lines" style="padding-top:12px;border-top:1px solid var(--line)">
          <div class="line"><span>Subtotal</span><span>${money(calc.food)}</span></div>
          ${calc.adj !== 0 && html`<div class="line"><span>Fees & discounts</span><span>${money(calc.adj, { sign: true })}</span></div>`}
          <div class="line"><span>Tax</span><span>${money(calc.tax)}</span></div>
          <div class="line"><span>${tipLabel(bill, calc)}</span><span>${money(calc.tip)}</span></div>
          <div class="line total"><span>Total</span><span>${money(calc.grand)}</span></div>
        </div>
        ${totalsKnown && !calc.taxMissing && (Math.abs(receiptTotals - calc.grand) <= 2
          ? html`<div class="check ok"><${Icon} n="check" /><span>Matches the receipt total${calc.tipMode !== "printed" && calc.tip ? " plus tip" : ""}.</span></div>`
          : html`<div class="check warn"><${Icon} n="alert" /><span>The receipt${bill.receipts.length > 1 ? "s" : ""} total ${money(sum(bill.receipts.map((r) => r.total || 0)))}${calc.tipMode !== "printed" && calc.tip ? ` (${money(receiptTotals)} with tip)` : ""}. Check the tax and any fees.</span></div>`)}
      </section>

      <button class="btn primary block" disabled=${!canGo} onClick=${next}>See who owes what</button>
      ${!canGo && html`<p class="note" style="text-align:center">${!calc.complete ? "Assign every item to continue." : "Enter the tax for each receipt to continue."}</p>`}
    </div>
  </main>`;
}

  const finish = () => { mutate((b) => { b.status = "done"; b.step = "summary"; }, { undo: false }); go("home"); toast("Saved to history"); };
  const header = html`<header class="topbar">
    <div class="tb-left"><button class="navbtn" onClick=${() => go(calc.complete ? "tip" : "items")}><${Icon} n="chevL" />${calc.complete ? "Tax & Tip" : "Items"}</button></div>
    <span class="tb-title">Split</span>
    <div class="tb-right">${calc.complete && html`<button class="navbtn go" onClick=${finish}>Done</button>`}</div>
  </header>`;
  if (!calc.complete || calc.taxMissing) {
    return html`<main class="app">${header}<div class="stack"><div class="empty">
      <b>${calc.complete ? "Tax is missing" : "Some items still need an owner"}</b>
      <span>${calc.complete ? "Enter the tax for each receipt first." : `${plural(calc.left, "item")} left to assign.`}</span>
      <button class="btn primary" onClick=${() => go(calc.complete ? "tip" : "items")}>${calc.complete ? "Go to tax & tip" : "Assign items"}</button>
    </div></div></main>`;
  }
  return html`<main class="app">${header}
    <div class="sum-wrap"><article class="sum-card" aria-label="Who owes what">
      <h1 class="sum-title">${billTitle(bill)}</h1>
      <p class="sum-meta">${[fmtDate(billDate(bill), true), plural(bill.people.length, "person", "people"), bill.receipts.length > 1 ? plural(bill.receipts.length, "receipt") : null].filter(Boolean).join(" · ")}</p>
      <div class="plist">
        ${bill.people.map((p) => {
          const c = calc.per[p.id], paid = paidOf(p) && !p.me;
          return html`<div key=${p.id} class=${"pline" + (paid ? " paid" : "")} style=${{ "--pc": pcolor(p.color) }}>
            ${p.me
              ? html`<span class="paid-btn" style="visibility:hidden" aria-hidden="true"></span>`
              : html`<button class=${"paid-btn" + (paid ? " on" : "")} aria-pressed=${paid ? "true" : "false"} aria-label=${paid ? `Mark ${p.name} as not paid` : `Mark ${p.name} as paid`}
                  onClick=${() => mutate((b) => { b.paid = { ...(b.paid || {}), [p.id]: !paid }; })}><${Icon} n="check" /></button>`}
            <button class="pl-name" aria-expanded=${open === p.id ? "true" : "false"} onClick=${() => setOpen(open === p.id ? null : p.id)}>${p.name}${p.me && html`<span class="pill">you</span>`}${paid && html`<span class="pill good">Paid</span>`}</button>
            <span class="pl-amt">${money(c.total)}</span>
            <span class="pl-items">${personLines(c.parts).join(", ") || "Nothing assigned"}</span>
            ${open === p.id && html`<div class="pl-break"><span>Items ${money(c.food)}</span>${c.adj !== 0 && html`<span>Fees ${money(c.adj, { sign: true })}</span>`}<span>Tax ${money(c.tax)}</span><span>Tip ${money(c.tip)}</span></div>`}
          </div>`;
        })}
      </div>
      <div class="sum-foot lines">
        <div class="line"><span>Subtotal</span><span>${money(calc.food)}</span></div>
        ${calc.adj !== 0 && html`<div class="line"><span>Fees & discounts</span><span>${money(calc.adj, { sign: true })}</span></div>`}
        <div class="line"><span>Tax</span><span>${money(calc.tax)}</span></div>
        <div class="line"><span>${tipLabel(bill, calc)}</span><span>${money(calc.tip)}</span></div>
        <div class="line total"><span>Total</span><span>${money(calc.grand)}</span></div>
      </div>
    </article></div>
    <div class="settle">
      ${others.length
        ? html`<span><b>${paidCount} of ${others.length}</b> paid${owedLeft > 0 ? html` · <b>${money(owedLeft)}</b> still owed` : ""}</span>`
        : html`<span>Everyone's marked as you. Fix it in People.</span>`}
      ${!bill.people.some((p) => p.me) && html`<button class="text-btn" onClick=${() => openSheet({ type: "people" })}>Which one is you?</button>`}
    </div>
    <div class="sum-actions">
      <button class="btn" onClick=${copy}><${Icon} n="copy" />Copy text</button>
      <button class="btn" disabled=${busy} onClick=${image}><${Icon} n="image" />${busy ? "Making image…" : "Share image"}</button>
      <button class="btn primary wide" onClick=${finish}>${bill.status === "done" ? "Done" : "Finish and save"}</button>
    </div>
    <p class="note" style="text-align:center;margin-top:14px">Tap a name to see their items, tax and tip. Tap a circle when someone pays you back.</p>
  </main>`;
}

/* ================= app ================= */
const billRefGlobal = { current: null };
let undoGlobal = () => {};
const pendingFocus = { id: null };
let OPEN = null;

function ItemsHost(props) {
  const [focusOnce] = useState(() => { const f = pendingFocus.id; pendingFocus.id = null; return f; });
  return html`<${ItemsScreen} ...${props} initialFocus=${focusOnce} />`;
}

function App({ initBill, initView }) {
  const [bills, setBills] = useState(() => Store.list());
  const [bill, setBillS] = useState(initBill);
  const [view, setView] = useState(initView);
  const [sheet, setSheet] = useState(null);
  const [toastS, setToastS] = useState(null);
  const [scan, setScan] = useState(null);
  const [scanAvail, setScanAvail] = useState("checking");
  const [sel, setSel] = useState(() => ({ mode: "person", ids: initBill ? initBill.people.slice(0, 1).map((p) => p.id) : [] }));
  const [editMode, setEditMode] = useState(false);
  const undo = useRef([]);
  if (billRefGlobal.current === null && initBill) billRefGlobal.current = initBill;
  CURRENCY = (bill && bill.currency) || "USD";

  const showToast = (text, action) => setToastS({ text, action, k: Date.now() + Math.random() });
  const setBill = (b) => { billRefGlobal.current = b; setBillS(b); };
  function mutate(fn, opts = {}) {
    const prev = billRefGlobal.current;
    if (!prev) return;
    const next = clone(prev);
    fn(next);
    next.updatedAt = Math.max(Date.now(), (prev.updatedAt || 0) + 1);
    if (opts.undo !== false) {
      const top = undo.current[undo.current.length - 1], now = Date.now();
      if (opts.coalesce && top && top.key === opts.coalesce && now - top.t < 5000) top.t = now;
      else { undo.current.push({ bill: prev, key: opts.coalesce || null, t: now }); if (undo.current.length > 60) undo.current.shift(); }
    }
    setBill(next);
    Store.save(next);
  }
  undoGlobal = () => {
    const e = undo.current.pop(), cur = billRefGlobal.current;
    if (!e || !cur || e.bill.id !== cur.id) return;
    const restored = clone(e.bill);
    restored.updatedAt = Math.max(Date.now(), (cur.updatedAt || 0) + 1);
    setBill(restored);
    Store.save(restored);
  };

  useEffect(() => Store.on(() => {
    setBills(Store.list());
    const cur = billRefGlobal.current;
    if (!cur) return;
    const sb = Store.bills.get(cur.id);
    if (sb && sb !== cur && (sb.updatedAt || 0) > (cur.updatedAt || 0)) setBill(clone(sb));
  }), []);
  useEffect(() => {
    let alive = true;
    (async () => {
      const s = await cap("sample");
      const lim = s ? await s.limits().catch(() => null) : null;
      if (alive) setScanAvail(!s ? "off" : lim && lim.images ? "photo" : "chat");
    })();
    return () => { alive = false; };
  }, []);
  const peopleKey = bill ? bill.people.map((p) => p.id).join(",") : "";
  useEffect(() => {
    if (!bill) return;
    const ids = bill.people.map((p) => p.id);
    setSel((s) => {
      if (s.mode === "everyone") return ids.length >= 2 ? s : { mode: "person", ids: ids.slice(0, 1) };
      const keep = s.ids.filter((id) => ids.includes(id));
      if (s.mode === "group") return keep.length >= 2 ? (keep.length === s.ids.length ? s : { mode: "group", ids: keep }) : { mode: "person", ids: keep.length ? keep : ids.slice(0, 1) };
      if (keep.length) return keep.length === s.ids.length ? s : { mode: "person", ids: keep };
      return ids.length ? { mode: "person", ids: ids.slice(0, 1) } : s.ids.length ? { mode: "person", ids: [] } : s;
    });
  }, [bill && bill.id, peopleKey]);
  useEffect(() => {
    OPEN = bill && view !== "home" ? { id: bill.id, view } : null;
    LS.set("rs1.open", OPEN);
  }, [bill && bill.id, view]);
  useEffect(() => { document.body.classList.toggle("has-dock", view === "items" && !!bill); }, [view, !!bill]);
  const live = useRef({});
  live.current = { view, bill, sheet, scan };
  useEffect(() => {
    const imageOf = (list) => [...(list || [])].find((f) => f && f.type && f.type.startsWith("image/"));
    const take = (f) => {
      const s = live.current;
      if (!f || s.scan || s.sheet) return false;
      if (!s.bill || s.view === "home") { startScan({ mode: "new", file: f }); return true; }
      if (s.view === "items") { startScan({ mode: "add", file: f }); return true; }
      return false;
    };
    const onPaste = (e) => { const f = imageOf(e.clipboardData && e.clipboardData.files); if (f && take(f)) e.preventDefault(); };
    const onOver = (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); };
    const onDrop = (e) => { const f = imageOf(e.dataTransfer && e.dataTransfer.files); if (f) { e.preventDefault(); take(f); } };
    addEventListener("paste", onPaste); addEventListener("dragover", onOver); addEventListener("drop", onDrop);
    return () => { removeEventListener("paste", onPaste); removeEventListener("dragover", onOver); removeEventListener("drop", onDrop); };
  }, []);

  const isEmpty = (b) => !b.people.length && b.receipts.every((r) => r.items.every((it) => !it.name.trim() && !it.price));
  function go(v) {
    setSheet(null);
    if (v === "home") {
      const cur = billRefGlobal.current;
      if (cur && isEmpty(cur)) Store.remove(cur.id);
      Store.flushAll();
      undo.current = [];
      setBill(null); setEditMode(false); setView("home");
      window.scrollTo(0, 0);
      return;
    }
    const cur = billRefGlobal.current;
    if (cur && cur.step !== v) mutate((b) => { b.step = v; }, { undo: false });
    setView(v);
    window.scrollTo(0, 0);
  }
  function openBill(b) {
    undo.current = [];
    setBill(clone(b));
    setEditMode(false);
    setSel({ mode: "person", ids: b.people.slice(0, 1).map((p) => p.id) });
    setView(b.status === "done" ? "summary" : b.step || "items");
    window.scrollTo(0, 0);
  }
  function startBill(receipts, edit, currency, importKey) {
    const b = newBill();
    if (currency) b.currency = currency;
    if (importKey) b.importKey = importKey;
    b.receipts.push(...[].concat(receipts));
    undo.current = [];
    setBill(b); Store.save(b);
    setSel({ mode: "person", ids: [] });
    setEditMode(!!edit);
    setView("items");
    window.scrollTo(0, 0);
    return b;
  }
  function manual() {
    setScan(null);
    const r = newReceipt(), it = newItem();
    r.items.push(it);
    pendingFocus.id = it.id;
    startBill(r, true);
  }
  function startScan(job) { setSheet(null); setScan(job); }
  function onScanResult(result) {
    const job = scan;
    setScan(null);
    applyScan(job, result);
  }
  function applyScan(job, result, importKey) {
    const scans = [].concat(result);
    const lines = sum(scans.map((x) => x.items.length));
    if (job.mode === "new") {
      startBill(scans.map(receiptFromScan), false, scans[0].currency, importKey);
      showToast(`Found ${plural(lines, "line")}${scans.length > 1 ? ` on ${scans.length} receipts` : ""}. Check them against the receipt`);
    } else if (job.mode === "add") {
      const rs = scans.map(receiptFromScan);
      mutate((b) => { b.receipts.push(...rs); });
      setTimeout(() => { const el = document.getElementById("rec-" + rs[0].id); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); }, 80);
      showToast(`Added ${plural(rs.length, "receipt")} with ${plural(lines, "line")}`);
    } else if (job.mode === "rescan") {
      setSheet({ type: "rescan", receiptId: job.receiptId, scan: scans[0] });
    }
  }
  useEffect(() => {
    const take = () => {
      const ho = readHandoff();
      if (!ho) return;
      try { history.replaceState(null, "", location.pathname + location.search); } catch {}
      const existing = Store.list().find((b) => b.importKey === ho.key);
      setScan(null); setSheet(null);
      if (existing) openBill(existing);
      else applyScan({ mode: "new" }, ho.scans, ho.key);
    };
    take();
    addEventListener("hashchange", take);
    return () => removeEventListener("hashchange", take);
  }, []);

  const calc = useMemo(() => (bill ? compute(bill) : null), [bill]);
  const closeSheet = () => setSheet(null);
  let screen;
  if (!bill || view === "home") {
    screen = html`<${Home} bills=${bills} scanAvail=${scanAvail} onScanFile=${(f) => startScan({ mode: "new", file: f })}
      onManual=${manual} onPaste=${() => setSheet({ type: "paste", job: { mode: "new" } })} onHowTo=${() => setSheet({ type: "howto", mode: "new" })} onOpen=${openBill} onOwed=${(key) => setSheet({ type: "owed", key })}
      onDelete=${(b) => {
        const copy = clone(b);
        Store.remove(b.id);
        showToast(`Deleted ${billTitle(b)}`, { label: "Undo", fn: () => { copy.updatedAt = Date.now(); Store.save(copy); } });
      }} />`;
  } else if (view === "tip") {
    screen = html`<${TaxTipScreen} bill=${bill} calc=${calc} mutate=${mutate} go=${go} />`;
  } else if (view === "summary") {
    screen = html`<${SummaryScreen} bill=${bill} calc=${calc} mutate=${mutate} go=${go} toast=${showToast} openSheet=${setSheet} />`;
  } else {
    screen = html`<${ItemsHost} bill=${bill} calc=${calc} mutate=${mutate} go=${go} openSheet=${setSheet} toast=${showToast}
      sel=${sel} setSel=${setSel} editMode=${editMode} setEditMode=${setEditMode} scanAvail=${scanAvail} startScan=${startScan} />`;
  }

  let sheetEl = null;
  if (sheet) {
    const common = { mutate, close: closeSheet, toast: showToast };
    const t = sheet.type;
    if (t === "owed") sheetEl = html`<${OwedSheet} bills=${bills} nameKey=${sheet.key} close=${closeSheet} toast=${showToast} />`;
    else if (t === "copy") sheetEl = html`<${CopySheet} text=${sheet.text} close=${closeSheet} />`;
    else if (t === "howto") sheetEl = html`<${HowToSheet} close=${closeSheet} onPaste=${() => setSheet({ type: "paste", job: { mode: sheet.mode || "new" } })} />`;
    else if (t === "paste") sheetEl = html`<${PasteSheet} job=${sheet.job} close=${closeSheet} onResult=${(r) => { const job = sheet.job; setSheet(null); applyScan(job, r); }} />`;
    else if (t === "image") sheetEl = html`<${ImageSheet} blob=${sheet.blob} filename=${sheet.filename} close=${closeSheet} toast=${showToast} />`;
    else if (bill) {
      if (t === "item") sheetEl = html`<${ItemSheet} key=${sheet.id} bill=${bill} id=${sheet.id} ...${common} />`;
      else if (t === "adj") sheetEl = html`<${AdjSheet} key=${sheet.id} bill=${bill} id=${sheet.id} fresh=${sheet.fresh} ...${common} />`;
      else if (t === "people") sheetEl = html`<${PeopleSheet} bill=${bill} setSel=${setSel} ...${common} />`;
      else if (t === "receipt") sheetEl = html`<${ReceiptSheet} key=${sheet.id} bill=${bill} id=${sheet.id} startScan=${startScan} scanAvail=${scanAvail} ...${common} />`;
      else if (t === "bill") sheetEl = html`<${BillSheet} bill=${bill} openSheet=${setSheet} ...${common}
        onDelete=${() => { const id = bill.id; setSheet(null); undo.current = []; setBill(null); setView("home"); Store.remove(id); showToast("Bill deleted"); }} />`;
      else if (t === "rescan") sheetEl = html`<${RescanSheet} bill=${bill} receiptId=${sheet.receiptId} scan=${sheet.scan} ...${common} />`;
    }
  }

  return html`${screen}${sheetEl}
    ${scan && html`<${ScanScreen} key=${scan.file.name + scan.file.size + scan.mode} job=${scan} onCancel=${() => setScan(null)} onResult=${onScanResult} onManual=${manual}
      onPaste=${(job) => { setScan(null); setSheet({ type: "paste", job: { mode: job.mode, receiptId: job.receiptId } }); }}
      onHowTo=${() => { const m = scan.mode === "add" ? "add" : "new"; setScan(null); setSheet({ type: "howto", mode: m }); }} />`}
    <${Toast} toast=${toastS} onDone=${() => setToastS(null)} />`;
}

function boot(data) {
  Store.init();
  const open = (data && data.open) || LS.get("rs1.open", null);
  const b = open && open.id ? Store.bills.get(open.id) : null;
  render(html`<${App} initBill=${b ? clone(b) : null} initView=${b ? open.view || "items" : "home"} />`, document.getElementById("root"));
  Store.connect();
}
(function start() {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") { try { hot.snapshot(() => ({ open: OPEN })); } catch {} }
  if (hot && typeof hot.ready === "function") hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
